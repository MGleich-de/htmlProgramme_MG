<style>

h2{font:600 19px Georgia,serif;margin:2px 0 6px}h3{font-size:14px;margin:10px 0 4px;color:var(--am)}
p{margin:6px 0}.mu{color:var(--mu);font-size:13px}

[hidden]{display:none!important}
.dsum{cursor:pointer;color:var(--am);font-weight:600;font-size:14px;margin:10px 0 4px}
html[data-theme=light]{--bg:#f1f6fa;--pn:#fff;--ln:#c5d5e1;--tx:#14232f;--mu:#506679;--ka:#1f6fd0;--an:#d4452f;--am:#b86e00;color-scheme:light}

html[data-theme=light] button,html[data-theme=light] select{background:#e4edf4;color:var(--tx)}

html[data-theme=light] .ox{background:#fde3dd;color:#b8301c}html[data-theme=light] .re{background:#dbe9fb;color:#1558b0}html[data-theme=light] .gs{background:#fff0cf;color:#8a5200}

<script>
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d');
const SUP={1:'⁺',2:'²⁺',3:'³⁺'};const ion=(s,z)=>`${s}<sup>${z>1?z:''}+</sup>`,anion=s=>`${s}<sup>−</sup>`,mol=s=>`${s}<sub>2</sub>`,co=n=>n>1?n+' ':'';

ZnBr2:{n:'Zink(II)bromid',f:'ZnBr<sub>2</sub>',M:'Zn',z:2,X:'Br',nx:2,mc:'#aab4c0',xc:'#d4601e',E:-.76,EX:1.07,ob:'grauer Zink-Überzug an der Kathode, gelb-orange Brom-Lösung an der Anode'},

CuCl2:{n:'Kupfer(II)chlorid',f:'CuCl<sub>2</sub>',M:'Cu',z:2,X:'Cl',nx:2,mc:'#d9824a',xc:'#b8e060',E:.34,EX:1.36,gas:1,ob:'rotbrauner Kupfer-Überzug an der Kathode, gelbgrünes Chlorgas an der Anode'}};
const KS={ZnBr2:{c:'Zn',z:2,Ec:-.76,a:'Br',Ea:1.07,mc:'#aab4c0',xc:'#d4601e'},ZnI2:{c:'Zn',z:2,Ec:-.76,a:'I',Ea:.54,mc:'#aab4c0',xc:'#e0a030'},CuCl2:{c:'Cu',z:2,Ec:.34,a:'Cl',Ea:1.36,mc:'#d9824a',xc:'#b8e060'},CuSO4:{c:'Cu',z:2,Ec:.34,mc:'#d9824a',xc:'#7fb0e0'},NiSO4:{c:'Ni',z:2,Ec:-.26,mc:'#8fc7a0',xc:'#7fb0e0'},AgNO3:{c:'Ag',z:1,Ec:.8,mc:'#e4ebf2',xc:'#7fb0e0'},NaCl:{c:'Na',z:1,Ec:-2.71,a:'Cl',Ea:1.36,mc:'#f0d27a',xc:'#b8e060'}};

let mode='mit',salt='ZnI2',on=false,galv=false,step=0,sp=1,pv=0,pvT=0,arrows=true,parts=[],dep=0,mols=0,pend=0,frame=0,es=0,hl='',fl=[];
const ks={salt:'ZnBr2',A:'C',K:'C',c:1,U:0,pts:[],auto:null};
if(matchMedia('(prefers-reduced-motion:reduce)').matches)sp=.4;
const inside=(x,y)=>(x>=208&&x<=312&&y>=229&&y<=464)||(x>=588&&x<=692&&y>=229&&y<=464)||(y>=406&&y<=464&&x>=208&&x<=692);
function rnd(){let x,y;do{x=200+Math.random()*500;y=232+Math.random()*236}while(!inside(x,y));return[x,y]}
const cur=()=>mode=='mit'?SALTS[salt]:KS[ks.salt];
function add(t,x,y){parts.push({t,x,y,r:Math.random()*6})}
function reset(){parts=[];dep=0;mols=0;pend=0;on=false;galv=false;es=0;fl=[];const s=cur();
 const nx=mode=='mit'?s.nx:(s.a?(s.z==2?2:1):1),z=s.z,nc=mode=='mit'?Math.round(24/(1+nx)):8;
 for(let i=0;i<nc;i++){let[x,y]=rnd();add('c',x,y)}
 const na=mode=='mit'?nc*nx:(s.a||true?nc*z:0);for(let i=0;i<na;i++){let[x,y]=rnd();add('a',x,y)}
 if(mode=='mit'){step=0;ui()}}
/* ---------- Kursstufe-Physik ---------- */
const sps=z=>SUP[z]||'';
function calc(){const s=KS[ks.salt],lc=Math.log10(ks.c),K=[],A=[];
 K.push({k:'M',eq:`${s.c}${sps(s.z)} + ${s.z} e⁻ → ${s.c}`,E:s.Ec+.059/s.z*lc,eta:-.02});
 K.push({k:'H',eq:'2 H₂O + 2 e⁻ → H₂ + 2 OH⁻',E:-.83+.059*7,eta:ETAH[ks.K]});
 const ea=ETAA[ks.A]||ETAA.C;
 if(s.a)A.push({k:'X',eq:`2 ${s.a}⁻ → ${s.a}₂ + 2 e⁻`,E:s.Ea-.059*lc,eta:ea[s.a]});
 A.push({k:'O',eq:'6 H₂O → O₂ + 4 H₃O⁺ + 4 e⁻',E:1.23-.059*7,eta:ea.O});
 if(EM[ks.A])A.push({k:'D',eq:`${ks.A} → ${ks.A}${sps(EM[ks.A][1])} + ${EM[ks.A][1]} e⁻`,E:EM[ks.A][0],eta:.02});
 K.forEach(r=>r.Ef=r.E+r.eta);A.forEach(r=>r.Ef=r.E+r.eta);
 const bK=K.reduce((a,b)=>b.Ef>a.Ef?b:a),bA=A.reduce((a,b)=>b.Ef<a.Ef?b:a);
 const nK=K.reduce((a,b)=>b.E>a.E?b:a),nA=A.reduce((a,b)=>b.E<a.E?b:a);
 const prs=[];K.forEach(k=>A.forEach(a=>prs.push(a.Ef-k.Ef)));prs.sort((a,b)=>a-b);
 return{K,A,bK,bA,nK,nA,U1:Math.max(.05,prs[0]),U2:Math.max(.05,prs[1]),U0:bA.E-bK.E}}
let C=calc();
const Icur=U=>Math.max(0,60*(U-C.U1))+Math.max(0,40*(U-C.U2));
/* ---------- Zeichnen ---------- */
const WIRE=[[640,130],[640,70],[480,70],[420,70],[260,70],[260,130]];
function pathPt(s){let L=[],t=0;for(let i=1;i<WIRE.length;i++){const d=Math.hypot(WIRE[i][0]-WIRE[i-1][0],WIRE[i][1]-WIRE[i-1][1]);L.push(d);t+=d}
 s=((s%1)+1)%1*t;for(let i=0;i<L.length;i++){if(s<=L[i]){const a=WIRE[i],b=WIRE[i+1],f=s/L[i];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}s-=L[i]}return WIRE[5]}
function draw(){const s=cur(),mc=s.mc,xc=s.xc,run=mode=='mit'?on&&!galv:C&&Icur(ks.U)>.5;
 g.clearRect(0,0,900,520);
 const bg=g.createLinearGradient(0,0,0,520);bg.addColorStop(0,'#0e1e2b');bg.addColorStop(1,'#08121a');g.fillStyle=bg;g.fillRect(0,0,900,520);
 g.fillStyle='#1b2a37';g.fillRect(0,490,900,30);g.fillStyle='#2c4254';g.fillRect(0,488,900,3);
 g.fillStyle='#3a4a58';g.fillRect(100,60,12,430);g.fillRect(100,455,560,8);
 const lq=g.createLinearGradient(0,215,0,470);lq.addColorStop(0,'rgba(80,190,200,.34)');lq.addColorStop(1,'rgba(40,120,150,.5)');g.fillStyle=lq;
 g.fillRect(200,215,120,255);g.fillRect(580,215,120,255);g.fillRect(200,400,500,70);
 const t=Math.min(.7,mols*.05);if(t>0){const rg=g.createRadialGradient(640,330,5,640,330,150);rg.addColorStop(0,xc+Math.round(t*255).toString(16).padStart(2,'0'));rg.addColorStop(1,xc+'00');g.fillStyle=rg;g.fillRect(560,215,160,255)}
 g.strokeStyle='rgba(220,240,255,.45)';g.lineWidth=3;g.lineJoin='round';g.beginPath();g.moveTo(190,205);g.lineTo(190,470);g.quadraticCurveTo(190,482,202,482);g.lineTo(698,482);g.quadraticCurveTo(710,482,710,470);g.lineTo(710,205);g.stroke();
 g.beginPath();g.moveTo(330,205);g.lineTo(330,392);g.lineTo(570,392);g.lineTo(570,205);g.stroke();
 g.strokeStyle='rgba(180,240,255,.5)';g.lineWidth=1.5;g.beginPath();g.moveTo(200,215);g.lineTo(320,215);g.moveTo(580,215);g.lineTo(700,215);g.stroke();
 // Elektroden (links Kathode/Minus, rechts Anode/Plus; im galvanischen Element getauscht)
 const eL=mode=='mit'?'C':ks.K,eR=mode=='mit'?'C':ks.A,th=Math.min(14,dep*.9);
 if(th>.3){g.fillStyle=mode=='mit'?s.mc:(KS[ks.salt].mc);g.beginPath();g.roundRect(245-th,222,30+2*th,128,6);g.fill()}
 for(const[x,c]of[[260,eL],[640,eR]]){const gr=g.createLinearGradient(x-15,0,x+15,0);gr.addColorStop(0,'#000');gr.addColorStop(.4,ELC[c]);gr.addColorStop(1,'#000');g.fillStyle=ELC[c];g.beginPath();g.roundRect(x-15,128,30,224,4);g.fill();g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x+3,128,12,224)}
 if(th>.3){g.fillStyle=(mode=='mit'?s.mc:KS[ks.salt].mc)+'cc';g.beginPath();g.roundRect(245-th,222,30+2*th,128,6);g.fill()}
 if(hl){const x=hl=='K'?260:640;g.strokeStyle=hl=='K'?'#5aa9ff':'#ff7a66';g.lineWidth=3;g.globalAlpha=.5+.5*Math.sin(frame*.1);g.beginPath();g.roundRect(x-34,120,68,250,14);g.stroke();g.globalAlpha=1}
 // Leitung + Quelle
 g.strokeStyle='#b9c4cc';g.lineWidth=3;g.beginPath();WIRE.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();
 g.fillStyle='#0b1620';g.fillRect(420,52,60,36);
 if(mode=='mit'&&galv){g.strokeStyle='#e8b04a';g.lineWidth=3;g.beginPath();g.arc(450,70,28,0,7);g.stroke();g.fillStyle='#e8b04a';g.font='600 15px system-ui';g.textAlign='center';
  const dE=(dep>0&&mols>.01&&!s.gas)?(s.EX-s.E)*Math.min(1,.6+dep/10):0;g.fillText(dE.toFixed(2).replace('.',',')+' V',450,75);g.font='11px system-ui';g.fillText('Voltmeter',450,38);window._dE=dE}
 else{g.strokeStyle='#b9c4cc';g.lineWidth=3;g.beginPath();g.moveTo(436,50);g.lineTo(436,90);g.stroke();g.lineWidth=6;g.beginPath();g.moveTo(462,58);g.lineTo(462,82);g.stroke();
  g.fillStyle='#ff7a66';g.font='600 16px system-ui';g.textAlign='center';g.fillText('+',478,60);g.fillStyle='#5aa9ff';g.fillText('−',420,60);g.fillStyle='#8fa8b8';g.font='11px system-ui';g.fillText('Gleichspannungsquelle',450,38)}
 g.font='600 14px system-ui';g.textAlign='center';
 const kl=galv?['Anode (Oxidation)','Minuspol','#ff7a66']:['Kathode (Reduktion)','Minuspol','#5aa9ff'],al=galv?['Kathode (Reduktion)','Pluspol','#5aa9ff']:['Anode (Oxidation)','Pluspol','#ff7a66'];
 g.fillStyle=kl[2];g.fillText(kl[0],260,108);g.fillStyle='#8fa8b8';g.font='12px system-ui';g.fillText(kl[1],260,124);
 g.fillStyle=al[2];g.font='600 14px system-ui';g.fillText(al[0],640,108);g.fillStyle='#8fa8b8';g.font='12px system-ui';g.fillText(al[1],640,124);
 // Teilchen
 g.textBaseline='middle';
 for(const p of parts){g.globalAlpha=(p.t=='c'||p.t=='a'||p.t=='m')?Math.max(.1,pv):1;
  if(p.t=='c'){g.fillStyle=mc;g.beginPath();g.arc(p.x,p.y,7,0,7);g.fill();if(pv>.5){g.fillStyle='#0b1620';g.font='bold 10px system-ui';g.textAlign='center';g.fillText('+',p.x,p.y+.5)}}
  else if(p.t=='a'){g.fillStyle=xc;g.beginPath();g.arc(p.x,p.y,9,0,7);g.fill();if(pv>.5){g.fillStyle='#0b1620';g.font='bold 12px system-ui';g.textAlign='center';g.fillText('−',p.x,p.y+.5)}}
  else if(p.t=='m'){g.fillStyle=xc;g.beginPath();g.arc(p.x-5,p.y,8,0,7);g.arc(p.x+5,p.y,8,0,7);g.fill()}
  else{g.strokeStyle=p.t=='h'?'#dff':p.t=='o'?'#ffd':xc;g.lineWidth=1.5;g.beginPath();g.arc(p.x,p.y,3+p.r*.5,0,7);g.stroke()}
  g.globalAlpha=1}
 // Pfeile
 if(arrows&&run&&pv>.4){g.fillStyle='rgba(255,255,255,.6)';g.font='13px system-ui';g.textAlign='center';g.fillText('Kationen ⟵',380,430);g.fillText('⟶ Anionen',520,430)}
 // Elektronen
 const moving=run||(galv&&window._dE>0);
 if(moving){const dir=galv?-1:1;for(let i=0;i<14;i++){const[x,y]=pathPt(es*dir+i/14);g.fillStyle='#ffe27a';g.shadowColor='#ffd24a';g.shadowBlur=10;g.beginPath();g.arc(x,y,4,0,7);g.fill();g.shadowBlur=0}
  g.fillStyle='#ffe27a';g.font='12px system-ui';g.textAlign='center';g.fillText(galv?'e⁻ ⟵ fließen zum Pluspol-Seite rechts':'e⁻ fließen von der Anode zur Kathode',450,150)}

 g.textBaseline='alphabetic';g.fillStyle='#8fa8b8';g.font='12px system-ui';g.textAlign='left';
 g.fillText(mode=='mit'?s.n+'-Lösung, Graphitelektroden':'Elektrolyt: '+ks.salt+' ('+ks.c.toFixed(2)+' mol/L)',16,508);
 g.textAlign='right';g.fillText(pv>.5?'Teilchenebene':'Stoffebene',884,508)}
/* ---------- Simulation ---------- */
function mv(p,dx,dy){const x=p.x+dx,y=p.y+dy;if(inside(x,y)){p.x=x;p.y=y}else if(inside(x,p.y))p.x=x;else if(inside(p.x,y))p.y=y}
function spawnProd(kind,x,y){if(parts.length<260)add(kind,x,y)}
function tick(){frame++;pv+=(pvT-pv)*.08;const s=cur();
 let run,drift;
 if(mode=='mit'){run=on&&!galv;drift=run?1.1*sp:0}else{const I=Icur(ks.U);run=I>.5;drift=run?Math.min(1.6,.3+I/80)*sp:0}
 if(run||(galv&&window._dE>0))es+=(mode=='mit'?.004:.002+Icur(ks.U)/60000)*sp;
 const gas=mode=='mit'?s.gas:0;
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];
  if(p.t=='c'||p.t=='a'){let dx=(Math.random()-.5)*1.6,dy=(Math.random()-.5)*1.6;
   if(drift){const arm=p.t=='c'?0:1,cu=p.x<450?0:1,tx=arm?640:260;
    if(cu!=arm){if(p.y<390)dy+=drift;else dx+=(tx<p.x?-1:1)*drift}else{if(p.y>345)dy-=drift;dx+=(tx-p.x)*.02}}
   mv(p,dx,dy);
   if(drift&&p.y<372&&Math.abs(p.x-(p.t=='c'?260:640))<24){
    fl.push({x:p.t=='c'?260:640,y:p.y,a:1});
    if(mode=='mit'){parts.splice(i,1);if(p.t=='c')dep++;else{pend++;if(pend==2){pend=0;if(gas)spawnProd('g',640,340);else{mols++;spawnProd('m',640,330)}}}}
