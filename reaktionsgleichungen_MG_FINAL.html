<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reaktionsgleichungen – Lernen und Trainieren</title>
<style>
/* ===== Design: hell als Standard, dunkel per Umschalter (data-theme) ===== */
:root{color-scheme:light;--bg:#f3f8fb;--card:#fff;--tx:#14232e;--mu:#4a6070;--pr:#0b7a9b;--pr2:#2563eb;--prt:#fff;--ok:#157a3d;--okb:#e0f6e8;--bad:#b3261e;--badb:#fde8e6;--wa:#7a4e00;--wab:#fff2cf;--bd:#cfe0e8;--g1:#bfe9f5;--g2:#e1d9ff;--sh:0 8px 24px rgba(20,60,90,.12)}
:root[data-theme=dark]{color-scheme:dark;--bg:#0c1319;--card:#14202a;--tx:#e8f2f7;--mu:#9fb6c4;--pr:#4cc9f0;--pr2:#7ea2ff;--prt:#04202b;--ok:#79e09a;--okb:#11301d;--bad:#ff938a;--badb:#3b1814;--wa:#ffd27a;--wab:#38290a;--bd:#2a3c49;--g1:#0f3a4d;--g2:#2a2060;--sh:0 8px 28px rgba(0,0,0,.5)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg) fixed;background-image:radial-gradient(900px 500px at 8% -10%,var(--g1),transparent),radial-gradient(800px 500px at 100% 0,var(--g2),transparent);transition:background-color .4s,color .4s}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);box-shadow:var(--sh)}
.top{max-width:900px;margin:auto;padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logo{width:34px;height:34px;flex:none;animation:bob 4s ease-in-out infinite}
.top h1{font-size:1.1rem;margin:0 auto 0 0;color:var(--pr);background:linear-gradient(90deg,var(--pr),var(--pr2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tab{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid transparent;background:none;color:var(--tx);font:inherit;font-weight:600;cursor:pointer;transition:all .25s}
.tab:hover{background:color-mix(in srgb,var(--pr) 12%,transparent)}
.tab[aria-current=true]{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--prt);box-shadow:0 4px 12px color-mix(in srgb,var(--pr) 40%,transparent)}
.theme{position:relative;width:46px;height:46px;border-radius:50%;border:2px solid var(--bd);background:var(--card);cursor:pointer;display:grid;place-items:center;transition:transform .3s,border-color .3s,box-shadow .3s}
.theme:hover{transform:rotate(18deg) scale(1.06);border-color:var(--pr);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 18%,transparent)}
.ic{position:absolute;width:24px;height:24px;transition:transform .55s cubic-bezier(.4,1.4,.5,1),opacity .35s}.sun{color:#f59f00}.moon{color:#cdd9ff}
:root:not([data-theme=dark]) .moon{opacity:0;transform:rotate(-90deg) scale(.3)}:root[data-theme=dark] .sun{opacity:0;transform:rotate(90deg) scale(.3)}
#pg{height:6px;background:var(--bd)}#pb{height:100%;width:0;background:linear-gradient(90deg,var(--pr),var(--pr2),var(--pr));background-size:200% 100%;animation:shim 3s linear infinite;transition:width .5s cubic-bezier(.4,1,.5,1);border-radius:0 6px 6px 0}
main{max-width:900px;margin:auto;padding:16px 14px 40px}
main>*{animation:rise .55s cubic-bezier(.2,.9,.3,1) both}main>*:nth-child(2){animation-delay:.07s}main>*:nth-child(3){animation-delay:.14s}main>*:nth-child(4){animation-delay:.21s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
h2{font-size:1.4rem;margin:.2em 0 .5em}h2:focus{outline:none}
.mu{color:var(--mu);margin:.2em 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.mini{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--pr);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);transition:transform .25s}.mini:hover{transform:translateY(-3px)}
.grid .mini{animation:rise .6s both}.grid .mini:nth-child(2){animation-delay:.08s}.grid .mini:nth-child(3){animation-delay:.16s}.grid .mini:nth-child(4){animation-delay:.24s}.grid .mini:nth-child(5){animation-delay:.32s}.grid .mini:nth-child(6){animation-delay:.4s}
.big{font-size:1.5rem;font-weight:700;text-align:center;padding:14px;border:3px solid transparent;border-radius:18px;margin:12px 0;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--pr),var(--pr2)) border-box}
.btn{min-height:48px;min-width:48px;padding:0 20px;font:inherit;font-weight:600;border-radius:14px;border:2px solid var(--pr);background:var(--card);color:var(--pr);cursor:pointer;transition:transform .15s,box-shadow .25s,background .25s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px color-mix(in srgb,var(--pr) 30%,transparent)}.btn:active:not(:disabled){transform:scale(.96)}
.btn.p{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--prt);border-color:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--pr2);outline-offset:2px}
.nav,.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:14px}.row{justify-content:flex-start}
/* Gleichungen: immer einzeilig, Schriftgröße wird per Skript an die Kastenbreite angepasst */
.eq{display:flex;flex-wrap:nowrap;white-space:nowrap;justify-content:center;align-items:center;gap:.35em;font-size:26px;margin:12px 0;overflow-x:auto;padding:4px 0}
.eq .num{font-size:1em;width:2.2em;height:1.9em;border-radius:.4em}.eq .num.fin{width:4em}
.sp{display:inline-flex;align-items:center;gap:.25em}.sp small{display:none}.sp.in{flex-direction:row}
.op{color:var(--mu);padding:0 .1em}
.num{width:58px;height:48px;font:inherit;font-size:1.2rem;text-align:center;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);transition:border-color .25s,box-shadow .25s}
.num:focus{border-color:var(--pr2);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr2) 22%,transparent);outline:none}
.num.ok{border-color:var(--ok);background:var(--okb);animation:tada .5s}.num.bad{border-color:var(--bad);background:var(--badb);animation:shake .4s}
.steppers{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:10px 0}.stp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border:1px solid var(--bd);border-radius:14px}.stp div{display:flex;align-items:center;gap:8px}.stp b{min-width:1.4em;text-align:center;font-size:1.3rem}
/* Teilchen */
.part{display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:6px;margin:12px 0;padding:10px;border-radius:16px;background:color-mix(in srgb,var(--pr) 6%,transparent);overflow-x:auto}
.ps{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px}
.mol{align-items:center;display:inline-flex;gap:2px;padding:4px;border:1.5px dashed var(--mu);border-radius:26px;margin:3px;animation:float 5s ease-in-out infinite}.mol:nth-child(3n){animation-delay:-1.5s}.mol:nth-child(3n+1){animation-delay:-3s}
.at{display:inline-flex;flex-shrink:0;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:#fff;text-shadow:0 0 3px #000;border:2px solid rgba(0,0,0,.3);box-shadow:inset -4px -5px 8px rgba(0,0,0,.25),inset 3px 3px 6px rgba(255,255,255,.35);animation:pop .55s cubic-bezier(.3,1.7,.5,1) both}
.at:nth-child(2){animation-delay:.06s}.at:nth-child(3){animation-delay:.12s}.at:nth-child(4){animation-delay:.18s}.at:nth-child(5){animation-delay:.24s}.at sup{font-size:.58rem;line-height:0;margin-left:1px}
.part.play .L .mol{animation:merge 1.8s ease-in-out both}.part.play .R .mol{animation:appear 1.8s ease-out both}
/* Tabelle */
.tb{border-collapse:separate;border-spacing:0;width:100%;margin:8px 0;border:1px solid var(--bd);border-radius:12px;overflow:hidden}.tb th,.tb td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:center}.tb th{background:color-mix(in srgb,var(--pr) 10%,transparent)}
.tb .g{color:var(--ok);font-weight:700}.tb .r{color:var(--bad);font-weight:700}.tb tr.hl td{background:var(--wab);animation:pulse 1.4s ease-in-out infinite}
.fb{padding:12px 14px;border-radius:14px;margin:10px 0;animation:pop .4s both}.fb:empty{display:none}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.bad{background:var(--badb);color:var(--bad)}.fb.hint{background:var(--wab);color:var(--wa)}
.lv{text-align:left;display:block;width:100%;margin-bottom:12px;padding:14px 18px}
.sw{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer;margin-bottom:6px}.sw input{width:24px;height:24px;accent-color:var(--pr)}
/* Konfetti */
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.conf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes float{50%{transform:translateY(-4px)}}@keyframes bob{50%{transform:translateY(-3px) rotate(6deg)}}
@keyframes shim{to{background-position:200% 0}}@keyframes pulse{50%{filter:brightness(1.12)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes tada{40%{transform:scale(1.12)}}
@keyframes merge{0%{opacity:1}45%{transform:translateX(16px) scale(.9)}100%{opacity:.25;transform:translateX(28px) scale(.7)}}
@keyframes appear{0%,45%{opacity:0;transform:scale(.2) rotate(-25deg)}80%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b7a9b"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><path d="M12 3h8v7l6 13a3 3 0 0 1-2.7 4.3H8.7A3 3 0 0 1 6 23l6-13z" fill="url(#lg)"/><circle cx="14" cy="21" r="2" fill="#fff" opacity=".85"/><circle cx="19" cy="17" r="1.4" fill="#fff" opacity=".7"/></svg>
    <h1>Reaktionsgleichungen</h1>
    <button class="tab" id="t1" onclick="go('learn')">Lernen</button>
    <button class="tab" id="t2" onclick="go('train')">Training</button>
    <button class="theme" id="th" onclick="toggleTheme()" aria-pressed="false" aria-label="Dunkelmodus einschalten" title="Hell / Dunkel">
      <svg class="ic sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="ic moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
  <div id="pg" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="pb"></div></div>
</header>
<main id="app"></main>

<script>
/* ===================== Hilfsfunktionen ===================== */
const $=s=>document.querySelector(s);
const sub=f=>f.replace(/\d+/g,'<sub>$&</sub>');           // Indizes tiefstellen
const COL={Fe:'#b8602e',O:'#d6333b',Mg:'#2f9e44',Cu:'#c77d1a',Al:'#6c7a89',Na:'#7048e8',Cl:'#0f9d7a',H:'#3b8fd6',C:'#3a3f45',Li:'#d6336c',Ca:'#d98200',N:'#3b4fd1',Zn:'#52667a'};
const col=e=>COL[e]||'#6c757d';
const gcd=(a,b)=>b?gcd(b,a%b):a;
function setBar(p){$('#pb').style.width=Math.round(p*100)+'%';$('#pg').setAttribute('aria-valuenow',Math.round(p*100))}

/* Formel -> {Element:Anzahl}; z. B. Fe2O3 -> {Fe:2,O:3} */
function atoms(f){const o={};f.replace(/([A-Z][a-z]?)(\d*)/g,(m,e,n)=>{o[e]=(o[e]||0)+(+n||1)});return o}
/* Gesamtzahl je Element für Formelliste mit Zahlen */
function count(sp,nums){const o={};sp.forEach((f,i)=>{const a=atoms(f);for(const e in a)o[e]=(o[e]||0)+a[e]*nums[i]});return o}
/* Gleichung aus Text: "Fe2O3+Mg>Fe+MgO|1,3,2,3" */
function P(s){const[a,b]=s.split('|'),[l,r]=a.split('>');return{L:l.split('+'),R:r.split('+'),sol:b.split(',').map(Number)}}
const flat=eq=>eq.L.concat(eq.R);
/* Atombilanz: Vergleich links/rechts – prüft die Richtigkeit, nicht nur eine Musterlösung */
function bal(eq,nums){const n=eq.L.length,l=count(eq.L,nums.slice(0,n)),r=count(eq.R,nums.slice(n));
  const es=[...new Set(Object.keys(l).concat(Object.keys(r)))].map(e=>({e,l:l[e]||0,r:r[e]||0,ok:(l[e]||0)==(r[e]||0)}));
  return{els:es,ok:es.every(x=>x.ok)}}
function tbl(eq,nums,hl){const b=bal(eq,nums);
  return'<table class="tb"><tr><th>Element</th><th>links</th><th>rechts</th><th>ausgeglichen?</th></tr>'+
  b.els.map(x=>`<tr class="${x.e==hl?'hl':''}"><td>${x.e}</td><td>${x.l}</td><td>${x.r}</td><td class="${x.ok?'g':'r'}">${x.ok?'✓ ja':'✗ nein'}</td></tr>`).join('')+'</table>'}
function eqStr(eq,nums){const n=eq.L.length,s=(a,o)=>a.map((f,i)=>(nums[o+i]>1?nums[o+i]+' ':'')+sub(f)).join(' + ');return s(eq.L,0)+' → '+s(eq.R,n)}
/* Teilchenbild: jede Formeleinheit als gestrichelte Kapsel mit farbigen Atomkreisen */
/* Ionenladungen bei Salzen: Metall + Nichtmetall; Metallladung ergibt sich aus der Anionenladung (z. B. Fe2O3: 3 O2- → 2 Fe3+) */
const MET=['Li','Na','K','Mg','Ca','Ba','Al','Fe','Cu','Zn','Pb','Ag'],ANI={O:-2,Cl:-1,N:-3,S:-2,Br:-1};
function ions(f){const a=atoms(f),ms=Object.keys(a).filter(e=>MET.includes(e)),ns=Object.keys(a).filter(e=>!MET.includes(e));
  if(ms.length!=1||!ns.length||ns.some(e=>!(e in ANI)))return null;                      // kein Salz (Metall, Element, Molekülstoff)
  const neg=ns.reduce((t,e)=>t-a[e]*ANI[e],0),o={};o[ms[0]]=neg/a[ms[0]];ns.forEach(e=>o[e]=ANI[e]);return o}
const chg=c=>(Math.abs(c)>1?Math.abs(c):'')+(c>0?'+':'−');
let SHOWION=true;   /* Schalter: Ionenladungen in den Teilchenbildern anzeigen */
/* Kreisgröße nach ungefährem Radius (pm): Kationen sind kleiner als ihre Atome, Anionen größer */
const RA={H:31,C:76,N:71,O:66,Cl:99,S:105,Br:114,Li:152,Na:186,K:227,Mg:160,Ca:197,Ba:222,Al:143,Fe:126,Cu:128,Zn:134,Pb:175,Ag:144};
const RI={'Li1':76,'Na1':102,'K1':138,'Mg2':72,'Ca2':100,'Ba2':135,'Al3':54,'Fe3':65,'Cu2':73,'Zn2':74,'Pb2':119,'Ag1':115,'O-2':140,'Cl-1':181,'S-2':184,'Br-1':196,'N-3':146};
const dia=r=>Math.max(28,Math.round(18+0.16*r));
function circle(e,c){const r=c==null?(RA[e]||100):(RI[e+c]||(c>0?(RA[e]||100)*0.5:(RA[e]||100)*2)),d=dia(r);
  return`<span class="at" style="background:${col(e)};width:${d}px;height:${d}px;font-size:${d<34?.62:.7}rem">${e}${c==null?'':`<sup>${chg(c)}</sup>`}</span>`}
function mols(f,n){let h='';const io=SHOWION?ions(f):null;for(let k=0;k<n;k++){h+='<span class="mol">';const a=atoms(f);for(const e in a)for(let j=0;j<a[e];j++)h+=circle(e,io?io[e]:null);h+='</span>'}return h}
function part(eq,nums){const sp=flat(eq),n=eq.L.length;
  const side=(a,b)=>sp.slice(a,b).map((f,i)=>mols(f,nums[a+i])).join('<span class="op">+</span>');
  return`<div class="part" aria-hidden="true"><span class="ps L">${side(0,n)}</span><span class="op">→</span><span class="ps R">${side(n,sp.length)}</span></div>`}
/* Reihenfolge zum Ausgleichen: Elemente in reinen Stoffen (O2, H2, Mg …) sowie O und H zuletzt */
function order(eq){const sp=flat(eq),es=[...new Set(sp.flatMap(f=>Object.keys(atoms(f))))];
  const pr=e=>(sp.some(f=>{const a=atoms(f);return a[e]&&Object.keys(a).length==1})?1:0)+(e=='O'||e=='H'?1:0);
  return es.map((e,i)=>[e,i]).sort((a,b)=>pr(a[0])-pr(b[0])||a[1]-b[1]).map(x=>x[0])}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ===================== Navigation ===================== */
let mode='learn';
function go(m){mode=m;$('#t1').setAttribute('aria-current',m=='learn');$('#t2').setAttribute('aria-current',m=='train');m=='learn'?render1():menu()}

/* ===================== TEIL 1: Erklärung ===================== */
let V=0;const NS=10;
const EXQ=P('Fe2O3+Mg>Fe+MgO|1,3,2,3');
const EXS=[[1,1,1,1],[1,1,2,1],[1,1,2,3],[1,3,2,3],[1,3,2,3]];
const EXH=[null,'Fe','O','Mg',null];
const EXT=[
 ['Schritt 1: Formeln hinschreiben','Eisen(III)-oxid reagiert mit Magnesium zu Eisen und Magnesiumoxid. Die Formeln sind: '+sub('Fe2O3')+' (Salz), Mg (Metall), Fe (Metall), MgO (Salz). Ab jetzt ändern wir sie nie mehr! Fe<sub>2</sub>O<sub>3</sub> und MgO sind Salze, deshalb tragen ihre Kreise Ionenladungen (z. B. Fe<sup>3+</sup>, O<sup>2−</sup>). Schau in die Tabelle: noch passt nicht alles.'],
 ['Schritt 2: Fe ausgleichen','In '+sub('Fe2O3')+' stecken 2 Fe-Atome, rechts steht aber nur 1 Fe. Also schreiben wir eine <b>2 vor Fe</b>.'],
 ['Schritt 3: O ausgleichen','In '+sub('Fe2O3')+' stecken 3 O-Atome, jedes MgO hat nur 1 O. Also schreiben wir eine <b>3 vor MgO</b>.'],
 ['Schritt 4: Mg angleichen','Durch 3 MgO stehen rechts jetzt 3 Mg-Atome (3 × (1 Mg + 1 O)). Also muss auch links eine <b>3 vor Mg</b> stehen.'],
 ['Geschafft!','Alle Elemente sind links und rechts gleich oft da. Reihenfolge: erst Fe, dann O, zuletzt Mg (das Element, das ganz allein steht).']];
let GN=[1,1,1];const GQ=P('Mg+O2>MgO|2,1,2');
function gc(i,d){GN[i]=Math.max(1,Math.min(9,GN[i]+d));render1()}

function slide(){
 if(V==0)return`<h2 tabindex="-1">Grundwissen vorab</h2><div class="grid">
 <div class="mini"><b>Metalle</b> bestehen aus Atomen.<br>Formel = Atomsymbol: Fe, Mg, Cu, Al</div>
 <div class="mini"><b>Nichtmetall-Elemente</b> liegen als Moleküle vor.<br>${sub('O2')}, ${sub('H2')}, ${sub('N2')}, ${sub('Cl2')}</div>
 <div class="mini"><b>Salze und Metalloxide</b> sind Ionenverbindungen → Verhältnisformeln.<br>MgO, ${sub('Fe2O3')}, ${sub('Al2O3')}</div>
 <div class="mini"><b>Flüchtige Stoffe</b> sind Molekülverbindungen.<br>${sub('H2O')}, ${sub('CO2')}, ${sub('CH4')}, ${sub('NH3')}</div>
 <div class="mini"><b>Metall + Nichtmetall</b> → Salz.<br><b>Nichtmetall + Nichtmetall</b> → flüchtiger Stoff.</div>
 <div class="mini"><b>Kohlenstoff</b> schreibst du einfach als C (nicht als Molekül).</div></div><p class="mu">Autor: Matthias Gleich</p>`;
 if(V==1)return`<h2 tabindex="-1">Die 3 Schritte</h2><div class="card"><p><b>1.</b> Schreibe die <b>richtigen Formeln</b> der Edukte und Produkte hin. Danach änderst du sie <b>nie mehr</b>.</p>
 <p><b>2.</b> <b>Zähle die Atome</b> jedes Elements auf beiden Seiten.</p>
 <p><b>3.</b> <b>Gleiche aus</b> mit stöchiometrischen Zahlen: große Zahlen <b>vor</b> der Formel. Die kleinen Indizes bleiben tabu!</p></div>
 <p class="mu">Beispiel: aus ${sub('Fe2O3')} + Mg → Fe + MgO wird gleich eine richtige Gleichung.</p>`;
 if(V==2)return`<h2 tabindex="-1">Die wichtigste Regel</h2><div class="big">3 MgO bedeutet 3 × (1 Mg + 1 O)</div>
 <div class="part" aria-label="3 MgO besteht aus 3 Mg und 3 O">${mols('MgO',3)}</div>
 <p>Die stöchiometrische Zahl vor der Formel gilt für die <b>ganze</b> Formel. In 3 MgO stecken also 3 Mg und 3 O.</p><p class="mu">MgO ist ein Salz. Deshalb zeigen die Kreise die Ionen mit ihrer Ladung (hochgestellt): Mg<sup>2+</sup> und O<sup>2−</sup>. Bei Metallen (Mg, Fe) und Molekülen (O<sub>2</sub>) gibt es keine Ladung. Mit dem Schalter oben kannst du die Ladungen aus- und einblenden.</p><p class="mu">Auch die Größe der Kreise stimmt ungefähr: Positive Ionen sind kleiner als ihre Atome (Mg<sup>2+</sup> &lt; Mg), negative Ionen sind größer (O<sup>2−</sup> &gt; O).</p>`;
 if(V<8){const s=V-3,n=EXS[s],h=EXH[s];
  return`<h2 tabindex="-1">Beispiel (${s+1}/5): ${EXT[s][0]}</h2><div class="card"><div class="eq" aria-label="Gleichung"><span>${eqStr(EXQ,n)}</span></div>${part(EXQ,n)}${s==4?'<button class="btn" onclick="playR()">▶ Reaktion abspielen</button>':''}${tbl(EXQ,n,h)}</div><p>${EXT[s][1]}</p>`}
 if(V==8){const b=bal(GQ,GN),g=GN.reduce(gcd);
  return`<h2 tabindex="-1">Jetzt du: Magnesium + Sauerstoff → Magnesiumoxid</h2><p>Stelle die stöchiometrischen Zahlen mit + und − ein, bis in der Tabelle überall ✓ steht.</p>
  <div class="card"><div class="eq"><span>${eqStr(GQ,GN)}</span></div>
  <div class="steppers">${flat(GQ).map((f,i)=>`<div class="stp"><span>${sub(f)}</span><div><button class="btn" aria-label="stöchiometrische Zahl vor ${f} verringern" onclick="gc(${i},-1)">−</button><b>${GN[i]}</b><button class="btn" aria-label="stöchiometrische Zahl vor ${f} erhöhen" onclick="gc(${i},1)">+</button></div></div>`).join('')}</div>
  ${part(GQ,GN)}<button class="btn" onclick="playR()">▶ Reaktion abspielen</button>${tbl(GQ,GN)}<div class="fb ${b.ok?(g>1?'hint':'ok'):'bad'}" aria-live="polite">${b.ok?(g>1?'Stimmt, aber kürzbar: Geht es auch mit kleineren stöchiometrischen Zahlen?':'Super! 2 Mg + O₂ → 2 MgO ist richtig.'):'Noch nicht ausgeglichen. Welches Element hat links und rechts unterschiedlich viele Atome?'}</div></div>`}
 return`<h2 tabindex="-1">Tipps und häufige Fehler</h2><div class="card"><p><b>Strategie:</b> Gleiche zuerst das Element aus, das nur in einer Verbindung je Seite vorkommt. Sauerstoff, Wasserstoff und Elemente wie ${sub('O2')} oder ${sub('H2')} kommen zuletzt.</p></div>
 <div class="card"><p><b>Häufige Fehler</b></p><p>✗ Den Index ändern, z. B. ${sub('MgO2')} statt 2 MgO.<br>✗ Die stöchiometrische Zahl nur vor ein Element schreiben (nicht 'M2gO'). Sie gilt für die ganze Formel.</p></div>
 <button class="btn p" onclick="go('train')">Los zum Training</button>`}

const SW=()=>`<label class="sw"><input type="checkbox" role="switch" id="ionsw" ${SHOWION?'checked':''} onchange="togIon(this.checked)"> Ionenladungen bei Salzen anzeigen</label>`;
function togIon(v){SHOWION=v;render1();$('#ionsw').focus()}
function render1(foc){setBar((V+1)/NS);
 $('#app').innerHTML=(V>=2&&V<=8?SW():'')+slide()+`<div class="nav"><button class="btn" onclick="nav(-1)" ${V==0?'disabled':''}>Zurück</button><span class="mu" style="align-self:center">${V+1} / ${NS}</span><button class="btn p" onclick="nav(1)" ${V==NS-1?'disabled':''}>Weiter</button></div>`;
 if(foc){const h=$('h2');h&&h.focus()}fit()}
function nav(d){V=Math.max(0,Math.min(NS-1,V+d));render1(true);scrollTo(0,0)}

/* ===================== TEIL 2: Training ===================== */
/* Aufgabenpool: Stufe 1 = L1 (Formeln gegeben), Stufe 2 = W (Wortgleichungen), Stufe 3 = L3 (schwerer, mit Zählhilfe) */
/* Drei Pools OHNE gemeinsame Gleichungen: Stufe 1 = L1 (Formeln gegeben), Stufe 2 = W (Wortgleichung, Formeln, Zahlen), Stufe 3 = W3 (nur Wortgleichung, alles selbst) */
const L1=['CuO+Mg>Cu+MgO|1,1,1,1','Fe2O3+Al>Fe+Al2O3|1,2,2,1','Na+Cl2>NaCl|2,1,2','Li+O2>Li2O|4,1,2','Mg+N2>Mg3N2|3,1,1','CuO+H2>Cu+H2O|1,1,1,1','Fe2O3+H2>Fe+H2O|1,3,2,3','Zn+O2>ZnO|2,1,2','Mg+Cl2>MgCl2|1,1,1','PbO+C>Pb+CO2|2,1,2,1','Ba+O2>BaO|2,1,2','Zn+HCl>ZnCl2+H2|1,2,1,1'];
/* Typen: m Metall, e Nichtmetall-Element (Molekül), s Salz/Oxid, v flüchtiger Stoff, c Kohlenstoff */
const W=[
 {t:'Zinkoxid reagiert mit Kohlenstoff zu Zink und Kohlenstoffdioxid',s:'ZnO+C>Zn+CO2|2,1,2,1',n:'Zinkoxid,Kohlenstoff,Zink,Kohlenstoffdioxid',y:'s,c,m,v'},
 {t:'Calcium reagiert mit Sauerstoff zu Calciumoxid',s:'Ca+O2>CaO|2,1,2',n:'Calcium,Sauerstoff,Calciumoxid',y:'m,e,s'},
 {t:'Wasserstoff reagiert mit Chlor zu Chlorwasserstoff',s:'H2+Cl2>HCl|1,1,2',n:'Wasserstoff,Chlor,Chlorwasserstoff',y:'e,e,v'},
 {t:'Aluminium reagiert mit Sauerstoff zu Aluminiumoxid',s:'Al+O2>Al2O3|4,3,2',n:'Aluminium,Sauerstoff,Aluminiumoxid',y:'m,e,s'},
 {t:'Kalium reagiert mit Chlor zu Kaliumchlorid',s:'K+Cl2>KCl|2,1,2',n:'Kalium,Chlor,Kaliumchlorid',y:'m,e,s'},
 {t:'Kupfer(II)-oxid reagiert mit Kohlenstoff zu Kupfer und Kohlenstoffdioxid',s:'CuO+C>Cu+CO2|2,1,2,1',n:'Kupfer(II)-oxid,Kohlenstoff,Kupfer,Kohlenstoffdioxid',y:'s,c,m,v'},
 {t:'Natrium reagiert mit Sauerstoff zu Natriumoxid',s:'Na+O2>Na2O|4,1,2',n:'Natrium,Sauerstoff,Natriumoxid',y:'m,e,s'},
 {t:'Silberoxid zerfällt in Silber und Sauerstoff',s:'Ag2O>Ag+O2|2,4,1',n:'Silberoxid,Silber,Sauerstoff',y:'s,m,e'}];
const W3=[
 {t:'Eisen reagiert mit Sauerstoff zu Eisen(III)-oxid',s:'Fe+O2>Fe2O3|4,3,2',n:'Eisen,Sauerstoff,Eisen(III)-oxid',y:'m,e,s'},
 {t:'Aluminium reagiert mit Chlor zu Aluminiumchlorid',s:'Al+Cl2>AlCl3|2,3,2',n:'Aluminium,Chlor,Aluminiumchlorid',y:'m,e,s'},
 {t:'Stickstoff reagiert mit Wasserstoff zu Ammoniak',s:'N2+H2>NH3|1,3,2',n:'Stickstoff,Wasserstoff,Ammoniak',y:'e,e,v'},
 {t:'Methan reagiert mit Sauerstoff zu Kohlenstoffdioxid und Wasser',s:'CH4+O2>CO2+H2O|1,2,1,2',n:'Methan,Sauerstoff,Kohlenstoffdioxid,Wasser',y:'v,e,v,v'},
 {t:'Eisen(III)-oxid reagiert mit Kohlenstoff zu Eisen und Kohlenstoffdioxid',s:'Fe2O3+C>Fe+CO2|2,3,4,3',n:'Eisen(III)-oxid,Kohlenstoff,Eisen,Kohlenstoffdioxid',y:'s,c,m,v'},
 {t:'Magnesium reagiert mit Chlorwasserstoff zu Magnesiumchlorid und Wasserstoff',s:'Mg+HCl>MgCl2+H2|1,2,1,1',n:'Magnesium,Chlorwasserstoff,Magnesiumchlorid,Wasserstoff',y:'m,v,s,e'},
 {t:'Kupfer reagiert mit Sauerstoff zu Kupfer(II)-oxid',s:'Cu+O2>CuO|2,1,2',n:'Kupfer,Sauerstoff,Kupfer(II)-oxid',y:'m,e,s'},
 {t:'Calcium reagiert mit Stickstoff zu Calciumnitrid',s:'Ca+N2>Ca3N2|3,1,1',n:'Calcium,Stickstoff,Calciumnitrid',y:'m,e,s'},
 {t:'Kohlenstoffmonoxid reagiert mit Sauerstoff zu Kohlenstoffdioxid',s:'CO+O2>CO2|2,1,2',n:'Kohlenstoffmonoxid,Sauerstoff,Kohlenstoffdioxid',y:'v,e,v'},
 {t:'Eisen(III)-oxid reagiert mit Kohlenstoffmonoxid zu Eisen und Kohlenstoffdioxid',s:'Fe2O3+CO>Fe+CO2|1,3,2,3',n:'Eisen(III)-oxid,Kohlenstoffmonoxid,Eisen,Kohlenstoffdioxid',y:'s,v,m,v'}];
const TY={m:'Metalle schreibst du als Atomsymbol (z. B. Mg).',e:'Nichtmetall-Elemente liegen als Moleküle vor, mit Index 2 (O₂, H₂, N₂, Cl₂).',s:'Metall + Nichtmetall → Salz/Oxid: Verhältnisformel, das Metall steht zuerst.',v:'Nichtmetall + Nichtmetall → flüchtiger Stoff: Molekülformel.',c:'Kohlenstoff schreibst du einfach als C.'};
const best=[0,0,0];let R=null;
const stars=p=>p>=95?'★★★':p>=80?'★★☆':p>=60?'★☆☆':'☆☆☆';

function menu(){setBar(0);
 const nm=['Stufe 1: stöchiometrische Zahlen eintragen','Stufe 2: Wortgleichung → Formeln → stöchiometrische Zahlen','Stufe 3: Wortgleichung → komplette Reaktionsgleichung selbst aufstellen'];
 $('#app').innerHTML='<h2 tabindex="-1">Training</h2><p>Alle Stufen sind von Anfang an frei. Such dir eine aus.</p>'+
 nm.map((x,i)=>{const open=true;return`<button class="btn lv ${open?'p':''}" ${open?'':'disabled'} onclick="start(${i})">${open?'':'🔒 '}${x}<br><small>${open?'Beste Runde: '+best[i]+' % '+stars(best[i]):'Erreiche in Stufe '+i+' mindestens 60 %.'}</small></button>`}).join('')}

function start(lvl,tasks,retry){
 if(!tasks){const mk=w=>({eq:P(w.s),txt:w.t,names:w.n.split(','),types:w.y.split(',')});
  const pool=lvl==0?L1.map(s=>({eq:P(s)})):lvl==2?W3.map(mk):W.map(mk);
  tasks=shuffle(pool).slice(0,8)}
 R={lvl,tasks,i:0,res:[],retry:!!retry};showTask()}

function showTask(){
 const t=R.cur=R.tasks[R.i];R.ph=R.lvl==1?0:R.lvl==2?2:1;R.fok=false;R.tries=0;R.hint=0;R.hinted=false;R.done=false;setBar(R.i/R.tasks.length);
 $('#app').innerHTML=`<div class="card"><p class="mu">Stufe ${R.lvl+1} · Aufgabe ${R.i+1} von ${R.tasks.length}</p>
 <h2 tabindex="-1">${t.txt||'Gleiche die Gleichung aus.'}</h2>
 ${R.lvl==2?`<p><b>${t.names.slice(0,t.eq.L.length).join(' + ')} → ${t.names.slice(t.eq.L.length).join(' + ')}</b></p>`:''}
 <p class="mu">${R.lvl==1?'Trage zuerst die Formeln in der Reihenfolge des Satzes ein, danach die stöchiometrischen Zahlen.':R.lvl==2?'Stelle die komplette Reaktionsgleichung auf: Trage die Formeln (Reihenfolge wie im Satz) und die stöchiometrischen Zahlen ein. Leer oder 1 bedeutet 1.':'Trage die stöchiometrischen Zahlen vor den Formeln ein. Leer oder 1 bedeutet 1.'}</p>
 <div class="eq" id="eq"></div><div id="live"></div><div class="fb" id="fb" aria-live="polite"></div><div id="tb"></div>
 <div class="row" id="btns"><button class="btn p" id="bc" onclick="check()">Prüfen</button><button class="btn" id="bh" onclick="hint()">Tipp</button><button class="btn" id="bs" onclick="solve()">Lösung zeigen</button></div></div>`;
 drawEq();$('h2').focus()}

function drawEq(vals){const t=R.cur,eq=t.eq,sp=flat(eq),n=eq.L.length;let h='';
 /* F = Formelfeld, N = Feld für die stöchiometrische Zahl */
 const F=(i,f)=>`<input class="num fin${R.fok?' ok':''}" id="f${i}" aria-label="Formel für ${t.names[i]}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${vals||R.fok?f:''}"${R.fok?' readonly':''}>`;
 const N=(i,f)=>`<input class="num" id="n${i}" inputmode="numeric" maxlength="2" aria-label="stöchiometrische Zahl vor ${R.ph==2?t.names[i]:f}" value="${vals?vals[i]:''}">`;
 sp.forEach((f,i)=>{h+=i==n?'<span class="op">→</span>':i?'<span class="op">+</span>':'';
  if(R.ph==0)h+=`<span class="sp">${F(i,f)}<small>${t.names[i]}</small></span>`;
  else if(R.ph==1)h+=`<span class="sp in">${N(i,f)}<span>${sub(f)}</span></span>`;
  else h+=`<span class="sp in">${N(i,f)}${F(i,f)}</span>`});
 $('#eq').innerHTML=h;
 document.querySelectorAll('#eq input').forEach(x=>{x.addEventListener('keydown',e=>{if(e.key=='Enter'&&!R.done)check()});x.addEventListener('input',liveTb)});
 const f=$('#eq input');f&&f.focus();liveTb();fit()}

/* stöchiometrische Zahlen lesen: leer = 1; sonst ganze Zahl >= 1, sonst null */
function readNums(){const sp=flat(R.cur.eq),o=[];for(let i=0;i<sp.length;i++){const v=$('#n'+i).value.trim();if(v==='')o.push(1);else if(/^\d{1,2}$/.test(v)&&+v>0)o.push(+v);else return null}return o}
/* Stufe 2 und 3: Zählhilfe live, sobald die Formeln geprüft und richtig sind */
function liveTb(){if(R.done||!((R.lvl==1&&R.ph==1)||(R.lvl==2&&R.fok)))return;const n=readNums();$('#tb').innerHTML=n?'<p class="mu">Zählhilfe:</p>'+tbl(R.cur.eq,n):''}
const fb=(c,h)=>{const e=$('#fb');e.className='fb '+c;e.innerHTML=h};
const norm=s=>s.replace(/\s/g,'').replace(/[₀-₉]/g,c=>c.charCodeAt(0)-8320);

function check(){const t=R.cur,eq=t.eq,sp=flat(eq);
 if(R.ph==0||(R.ph==2&&!R.fok)){let all=true,first=-1;
  sp.forEach((f,i)=>{const el=$('#f'+i),ok=norm(el.value)==f;el.className='num fin '+(ok?'ok':'bad');if(!ok){all=false;if(first<0)first=i}});
  if(!all){R.tries++;fb('bad','Mindestens eine Formel stimmt noch nicht (rot markiert). Denk an: Metall = Atomsymbol, Nichtmetall-Element = Molekül, Metall + Nichtmetall = Verhältnisformel.');return}
  if(R.ph==0){R.ph=1;drawEq();fb('ok','Alle Formeln stimmen! Jetzt die stöchiometrischen Zahlen davor.');return}
  /* Stufe 3: Formeln sperren, danach direkt die stöchiometrischen Zahlen prüfen; Hilfen beginnen neu */
  R.fok=true;R.hint=0;document.querySelectorAll('.fin').forEach(x=>x.readOnly=true)}
 const nums=readNums();
 if(!nums){fb('bad','Bitte als stöchiometrische Zahlen nur ganze Zahlen ab 1 eintragen (oder das Feld leer lassen).');return}
 const b=bal(eq,nums);
 if(!b.ok){R.tries++;fb('bad','Noch nicht richtig: '+b.els.filter(x=>!x.ok).map(x=>`${x.e}: links ${x.l}, rechts ${x.r}`).join(' · '));$('#tb').innerHTML=tbl(eq,nums);return}
 const g=nums.reduce(gcd);
 if(g>1){fb('hint',`Stimmt, aber kürzbar! Alle stöchiometrischen Zahlen sind durch ${g} teilbar. Kürze sie, dann bist du fertig.`);$('#tb').innerHTML=tbl(eq,nums);return}
 const pts=R.tries==0&&!R.hinted?2:1;
 finish(pts,'Richtig! ✓ '+(pts==2?'Gleich beim ersten Versuch: 2 Punkte.':'Geschafft: 1 Punkt.'),'ok');$('#tb').innerHTML=tbl(eq,nums)}

function finish(pts,msg,c,extra){R.res[R.i]={t:R.cur,pts};R.done=true;if(pts==2)burst(22);
 document.querySelectorAll('#eq input').forEach(x=>x.disabled=true);
 ['bc','bh','bs'].forEach(i=>$('#'+i).disabled=true);
 fb(c,msg+(extra||''));const last=R.i==R.tasks.length-1;
 $('#btns').insertAdjacentHTML('beforeend',`<button class="btn p" id="nx" onclick="nextT()">${last?'Zur Auswertung':'Weiter'}</button>`);$('#nx').focus()}
function nextT(){R.i++;R.i>=R.tasks.length?evalR():showTask()}

function hint(){const t=R.cur,eq=t.eq;R.hinted=true;R.hint++;
 if(R.ph==0||(R.ph==2&&!R.fok)){if(R.hint==1)return fb('hint','Tipp 1: Überlege zuerst, zu welcher Stoffklasse jeder Stoff gehört: Metall, Nichtmetall-Element, Salz oder flüchtiger Stoff?');
  const sp=flat(eq);let i=sp.findIndex((f,k)=>norm($('#f'+k).value)!=f);if(i<0)i=0;
  return fb('hint',`Tipp 2: Schau dir „${t.names[i]}“ an. ${TY[t.types[i]]}`)}
 if(R.hint==1)return fb('hint','Tipp 1: Gleiche zuerst das Element aus, das nur in einer Verbindung je Seite vorkommt. O, H und Elemente wie O₂ oder H₂ kommen zuletzt.');
 const nums=readNums()||flat(eq).map(()=>1),b=bal(eq,nums),ord=order(eq);
 const e=ord.find(x=>b.els.find(y=>y.e==x&&!y.ok));
 if(!e)return fb('hint','Tipp 2: Alles ist ausgeglichen. Lassen sich alle stöchiometrischen Zahlen kürzen?');
 const x=b.els.find(y=>y.e==e);fb('hint',`Tipp 2: Kümmere dich jetzt um <b>${e}</b>: links ${x.l}, rechts ${x.r}. Welche stöchiometrische Zahl passt?`)}

function solve(){const t=R.cur,eq=t.eq,sp=flat(eq);
 if(R.ph==0){sp.forEach((f,i)=>$('#f'+i).value=f);R.ph=1}
 if(R.ph==2)R.fok=true;
 drawEq(eq.sol);$('#tb').innerHTML=tbl(eq,eq.sol);
 finish(0,'Lösung: '+eqStr(eq,eq.sol)+'<br>Erklärung: Gleiche die Elemente in dieser Reihenfolge aus: <b>'+order(eq).join(' → ')+'</b>. Die Tabelle zeigt: Bei jedem Element stehen links und rechts gleich viele Atome. Die stöchiometrischen Zahlen sind nicht weiter kürzbar.','hint')}

function evalR(){if(R.res.reduce((a,r)=>a+r.pts,0)>=1.6*R.tasks.length)setTimeout(()=>burst(70),200);const n=R.tasks.length,tot=R.res.reduce((a,r)=>a+r.pts,0),max=2*n,pc=Math.round(100*tot/max);
 const bad=R.res.filter(r=>r.pts<2);let un='';
 if(!R.retry){if(pc>best[R.lvl])best[R.lvl]=pc;}
 setBar(1);
 $('#app').innerHTML=`<div class="card"><h2 tabindex="-1">Auswertung</h2><div class="big">${tot} von ${max} Punkten<br>${stars(pc)} ${pc} %</div>${un}
 ${bad.length?'<p><b>Hier solltest du nochmal üben:</b></p><ul>'+bad.map(r=>`<li>${eqStr(r.t.eq,r.t.eq.sol)}</li>`).join('')+'</ul>':'<p>Keine Fehler – stark gemacht!</p>'}
 <div class="row">${bad.length?'<button class="btn p" onclick="start(R.lvl,bad_,true)">Fehleraufgaben wiederholen</button>':''}<button class="btn ${bad.length?'':'p'}" onclick="start(R.lvl)">Neue Runde</button><button class="btn" onclick="menu()">Zur Stufenwahl</button></div></div>`;
 window.bad_=bad.map(r=>r.t);$('h2').focus()}

/* ===================== Design-Helfer ===================== */
/* Hell/Dunkel-Umschalter (Kreis mit Sonne bzw. Mond); Standard: hell */
function toggleTheme(){const d=document.documentElement,dark=d.dataset.theme!='dark';d.dataset.theme=dark?'dark':'light';
 const b=$('#th');b.setAttribute('aria-pressed',dark);b.setAttribute('aria-label',dark?'Hellmodus einschalten':'Dunkelmodus einschalten')}
/* Gleichungen bleiben einzeilig: Schriftgröße schrumpft passend zur Kastenbreite */
function fit(){document.querySelectorAll('.eq').forEach(el=>{el.style.fontSize='';let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&fs>10){fs-=1;el.style.fontSize=fs+'px'}})}
addEventListener('resize',fit);
/* Reaktion abspielen: Edukte verschwinden, Produkte erscheinen */
function playR(){const p=document.querySelector('.part');if(!p)return;p.classList.remove('play');void p.offsetWidth;p.classList.add('play')}
/* Konfetti bei Erfolg */
function burst(n){const c=document.createElement('div'),k=['#0b7a9b','#f4b400','#e8590c','#2f9e44','#7048e8','#d6336c'];c.className='conf';c.setAttribute('aria-hidden','true');
 for(let i=0;i<n;i++){const e=document.createElement('i');e.style.cssText=`left:${Math.random()*100}%;background:${k[i%6]};animation-delay:${Math.random()*.4}s;animation-duration:${1.4+Math.random()*1.2}s;--dx:${Math.random()*160-80}px;--r:${Math.random()*720}deg`;c.appendChild(e)}
 document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}

go('learn');
</script>
