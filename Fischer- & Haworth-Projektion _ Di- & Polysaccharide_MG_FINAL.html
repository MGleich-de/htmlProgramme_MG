function drawO(){const c=OL[oi],zz=E(oz),kk=1+.4*zz,ww=760/kk,hh=400/kk;$('sv').setAttribute('viewBox',`${(L(380,390,zz)-ww/2).toFixed(1)} ${(L(200,205,zz)-hh/2).toFixed(1)} ${ww.toFixed(1)} ${hh.toFixed(1)}`);$('gx').style.opacity=(.15+.85*E(mp)).toFixed(2);$('gx').innerHTML=(()=>{const g=stg()[step];return g=='ed'?(c.poly?scn(c,5):scn(c,0,0)):g=='rot'?(()=>{const rr=E(K((rp-.08)/.84));return rotBack(c,rr)+scn(c,0,rr)+rotArr(c,rr)})():scn(c,6)+(g=='kond'?wat(c.amp?364:348,c.poly):'')})()}

function txtO(){const c=OL[oi],T7=[
['Edukte: zwei Monosaccharide',`<p>${c.ed}.</p><ul>${c.poly?`<li>Jedes Monomer besitzt eine <b>Hydroxygruppe am anomeren C-Atom</b> und eine <b>andere Hydroxygruppe</b> (beide markiert), meist am C4 (hier: ${c.ac}).</li><li>Die anomere OH-Gruppe eines Monomers reagiert mit der anderen OH-Gruppe eines weiteren Monomers. Der Vorgang wiederholt sich n-mal.</li>`:`<li>Das eine Monosaccharid reagiert mit seiner <b>Hydroxygruppe am anomeren C-Atom</b> (Halbacetal-OH, markiert).</li><li>Der Reaktionspartner reagiert mit einer <b>anderen Hydroxygruppe</b>, meist der am C4 (hier: ${c.ac}).</li>`}</ul>`],
['Kondensationsreaktion',`<ul><li>Die beiden markierten OH-Gruppen reagieren unter <b>Wasserabspaltung</b> miteinander: eine <b>Kondensationsreaktion</b>.</li><li>Dargestellt ist die Produktseite: Neben dem Zucker-Produkt entsteht ${c.poly?'<b>n H₂O</b>':'<b>H₂O</b>'}. Es stammt aus der anomeren OH-Gruppe und dem H-Atom der anderen OH-Gruppe.</li><li>Zucker–OH + HO–Zucker′ → Zucker–O–Zucker′ + H₂O</li><li>${c.sel}</li></ul>`],
['Produkt: '+c.n,`<p><b>${c.nm}</b></p><ul>${c.info}</ul><p>Der verbrückende Sauerstoff trägt zwei freie Elektronenpaare.</p>`]];const f=c.rs[1][2],ROT=['Zweiten Ring drehen',`<ul><li>${f>=2?'Der Fructose-Ring wird um <b>180\u00b0</b> um die senkrechte Achse gedreht (der Ringsauerstoff bleibt hinten).':'Der zweite Ring wird um <b>180\u00b0</b> um die waagrechte Achse umgeklappt (die andere Ringseite zeigt nach oben).'}</li><li>${c.at=='c6'?'Dadurch zeigt die CH\u2082OH-Gruppe (C6) nach unten und liegt dem anomeren OH (\u03b1, unten) des ersten Rings gegen\u00fcber.':f>=2?'Das anomere C2 steht jetzt links: seine CH\u2082OH-Gruppe zeigt nach oben, seine OH-Gruppe nach unten, passend zur \u03b1-OH-Gruppe der Glucose.':'Dadurch zeigt die reagierende 4-OH-Gruppe nach oben, passend zum \u03b2-st\u00e4ndigen anomeren OH des ersten Rings.'}</li><li>Die gestrichelte Linie ist die Drehachse, der Punkt auf dem Pfeil zeigt den Drehwinkel (0\u00b0 bis 180\u00b0).</li><li>Oben und unten vertauschen sich nur durch die Drehung; die Konfiguration des Molek\u00fcls bleibt unver\u00e4ndert.</li></ul>`],Z=(f?[T7[0],ROT,T7[1],T7[2]]:T7)[step];
