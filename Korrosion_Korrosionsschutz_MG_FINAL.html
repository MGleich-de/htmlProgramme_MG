{n:'Lokalelement',ctl:'<label><input type=checkbox data-k=kon checked> Kupfer berührt Zink</label>',eq:[['Anode: Zn{0} → Zn{+II}²⁺ + 2 e⁻'],['Kathode: 2 H{+I}₃O⁺ + 2 e⁻ → H{0}₂ + 2 H₂O']],t:`<p><b>Korrosion</b> ist die Zerstörung von Werkstoffen durch chemische Reaktionen mit der Umgebung. Berührt das unedlere Zink ein edleres Metall, laufen Oxidation und Reduktion räumlich getrennt ab: Zn (${G(0)}) wird zu Zn²⁺ (${G('+II')}), die Elektronen fließen zur Lokalkathode und reduzieren dort Oxoniumionen. Das Lokalelement ist ein kurzgeschlossenes galvanisches Element, an Kupfer ist die Überspannung des Wasserstoffs viel kleiner als an Zink.</p>`,a:()=>lokA(cA,0),b:()=>lokB(cB,0)},

{n:'Sauerstoffkorrosion',ctl:'',eq:[['Anode: 2 Fe{0} → 2 Fe{+II}²⁺ + 4 e⁻',0,.54],['Kathode: O{0}₂ + 2 H₂O + 4 e⁻ → 4 O{-II}H⁻',0,.54],['2 Fe + O₂ + 2 H₂O → 2 Fe(OH)₂',0,.54],['4 Fe{+II}(OH)₂ + O₂ + 2 H₂O → 4 Fe{+III}(OH)₃',.54,.82],['Fe(OH)₃ → FeO(OH) + H₂O',.82,1]],t:`<p>Sauerstoffkorrosion ist gefährlicher: E(O₂/OH⁻) = +0,81 V bei pH 7 (Wasserstoff: −0,41 V). Im sauerstoffarmen Tropfeninneren löst sich Eisen (Anode), am sauerstoffreichen Rand wird O₂ reduziert (Kathode): Lochfraß. Fe (${G(0)}) → Fe²⁺ (${G('+II')}) → Fe³⁺ (${G('+III')}) im Rost FeO(OH). Die Hydroxide sind Salze und bestehen aus Ionen. Zellspannung: 0,81 V − (−0,44 V) = 1,25 V.</p>`,a:t=>dropA(cA,t),b:()=>dropB(cB,.2)},
