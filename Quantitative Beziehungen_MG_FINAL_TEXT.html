<!DOCTYPE html><html lang="de" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quantitative Beziehungen</title>
<style>
:root{--bg:#f4f7fb;--bg2:#dfe9f8;--cd:#fff;--tx:#1b2433;--mu:#5d6b82;--ac:#3b6fd8;--g:#2e9e4f;--o:#e8890c;--r:#d93636;--sh:0 8px 28px rgba(40,60,100,.13);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0f1624;--bg2:#1a2a48;--cd:#1a2438;--tx:#e8eefb;--mu:#9fb0cc;--ac:#7aa2ff;--g:#5fd184;--o:#ffb34d;--r:#ff6b6b;--sh:0 8px 28px rgba(0,0,0,.45);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;transition:background .5s,color .5s}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}.bg b{position:absolute;border-radius:50%;filter:blur(50px);opacity:.35;animation:fl 14s ease-in-out infinite alternate}
.bg b:nth-child(1){width:260px;height:260px;background:var(--ac);left:-60px;top:10%}.bg b:nth-child(2){width:220px;height:220px;background:var(--g);right:-50px;top:45%;animation-delay:-5s}.bg b:nth-child(3){width:200px;height:200px;background:var(--o);left:30%;bottom:-60px;animation-delay:-9s}
@keyframes fl{to{transform:translate(40px,-60px) scale(1.2)}}
header,nav,main,footer{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding-top:18px;gap:12px}
h1{font-size:clamp(20px,5.5vw,32px);margin:0;line-height:1.15}.au{margin:2px 0 0;color:var(--mu);font-size:14px}
#th{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--ac);background:var(--cd);box-shadow:var(--sh);position:relative;cursor:pointer;overflow:hidden;transition:transform .4s}
#th:hover{transform:rotate(25deg) scale(1.08)}#th svg{position:absolute;inset:9px;width:24px;height:24px;transition:transform .6s,opacity .5s}
.mo{opacity:0;transform:rotate(-90deg) scale(.3)}.su{opacity:1;color:var(--o)}.mo{color:var(--ac)}
[data-theme=dark] .su{opacity:0;transform:rotate(90deg) scale(.3)}[data-theme=dark] .mo{opacity:1;transform:none}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding-top:14px;padding-bottom:6px}
nav button,.gh,#ck,.big{font:inherit;cursor:pointer;border-radius:999px;border:1.5px solid var(--ac);background:var(--cd);color:var(--tx);padding:7px 14px;white-space:nowrap;transition:.25s}
nav button.on,#ck,.big.pr{background:var(--ac);color:#fff}nav button:hover,.gh:hover{transform:translateY(-2px);box-shadow:var(--sh)}
main{padding-top:10px;padding-bottom:30px}
.hero{text-align:center;padding:18px 0 6px;animation:in .8s both}.hero p{color:var(--mu);margin:6px auto;max-width:520px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:14px 0}
.cd,.pn,.st{background:var(--cd);border-radius:20px;padding:18px;box-shadow:var(--sh);animation:in .7s both}
.cd{cursor:pointer;border:2px solid transparent;transition:.3s}.cd:hover{transform:translateY(-6px) rotate(-.5deg);border-color:var(--ac)}.cd h3{margin:4px 0}
.num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;margin-right:8px}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.96)}}
.st{display:none;margin:12px 0}.st.show{display:block}.st h3{margin:0 0 8px;font-size:18px}
.eq{display:block;white-space:nowrap;overflow:hidden;font-size:clamp(14px,4.6vw,24px);margin:8px 0;padding:2px 0}.eq .c{color:var(--r);font-style:normal;font-weight:700}
.sp.o{color:var(--o);font-weight:700}.sp.g{color:var(--g);font-weight:700}.ar{display:inline-block;animation:pu 1.6s ease-in-out infinite}@keyframes pu{50%{transform:translateX(5px)}}
sub{font-size:.65em;line-height:0}.o{color:var(--o)}.g{color:var(--g)}.r{color:var(--r)}.b{color:var(--ac)}.mu{color:var(--mu);font-size:14px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.95em}.fr i{font-style:normal;padding:0 4px}.fr i:first-child{border-bottom:1.5px solid currentColor}
.pt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:20px;margin:10px 0}.ds{display:inline-flex;gap:4px}.ds u{width:22px;height:22px;border-radius:50%;animation:pop .6s both,bob 2.4s ease-in-out infinite}
.ds u:nth-child(2){animation-delay:.15s,.3s}.ds u:nth-child(3){animation-delay:.3s,.6s}@keyframes pop{from{transform:scale(0)}}@keyframes bob{50%{transform:translateY(-4px)}}
.pg{height:8px;border-radius:9px;background:var(--bg2);overflow:hidden;margin:8px 0}.pg div{height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--g));transition:width .6s}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.in{display:flex;gap:8px;margin-top:10px}
input{font:inherit;flex:1;min-width:0;padding:9px 14px;border-radius:12px;border:1.5px solid var(--mu);background:var(--bg);color:var(--tx)}
.hs p{margin:8px 0;padding:10px 12px;border-left:4px solid var(--o);border-radius:8px;background:var(--bg);animation:in .5s both}
.ok{color:var(--g);font-weight:700;animation:pop .5s}.no{color:var(--r);animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

sup{font-size:.65em;line-height:0}.sg{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,auto);gap:34px 14px;margin:14px 0}.sg svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}.sg line{stroke:var(--mu);stroke-width:1.6;vector-effect:non-scaling-stroke;animation:fd 1s .7s both}@keyframes fd{from{opacity:0}}
.bx{position:relative;z-index:1;background:var(--cd);border:1.5px solid var(--mu);border-radius:12px;padding:8px 3px;text-align:center;font-size:clamp(11px,3.1vw,15px);line-height:1.35;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--sh);animation:in .7s both;transition:.3s}.bx:hover{transform:translateY(-4px);border-color:var(--ac)}.bx b{display:block}.bx small{display:block;font-size:.78em;color:var(--mu)}.bx.n{background:var(--ac);border-color:var(--ac);color:#fff}.bx.n small{color:#fff}
.ln{font-size:1em;margin:0;padding:3px 0;text-align:center}.tt{font-weight:700}.sm{font-size:.8em;font-weight:700}
.rw{display:flex;gap:10px;align-items:flex-start;margin-top:6px}.mn{flex:0 0 min(46%,190px)}.ms{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 8px}.ms svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}.ms line{stroke:var(--mu);stroke-width:1.2;opacity:.45}.ms line.hl{stroke:var(--ac);stroke-width:3.2;opacity:1}
.mb{position:relative;z-index:1;border:1.2px solid var(--mu);border-radius:7px;background:var(--cd);text-align:center;font-size:11px;line-height:1.15;padding:5px 2px;opacity:.6;display:grid;place-items:center}.mb.o2,.mb.g2,.mb.b2,.mb.og{color:#fff;opacity:1;border-color:transparent;text-shadow:0 0 3px rgba(0,0,0,.5)}.mb.o2{background:var(--o)}.mb.g2{background:var(--g)}.mb.b2{background:var(--ac)}.mb.og{background:linear-gradient(90deg,var(--o) 50%,var(--g) 50%)}
.lg{font-size:10px;color:var(--mu);margin-top:8px;line-height:1.6}.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 3px 0 0;vertical-align:middle}.lg .a{background:var(--o)}.lg .c{background:var(--g)}.lg .d{background:var(--ac)}

.bx.n,.mb[data-n]{cursor:pointer}.bx.n::after{content:"ⓘ";position:absolute;top:4px;right:8px;font-size:.9em}

.ci{width:2.1em;flex:none;min-width:0;padding:2px;margin:2px 0;text-align:center;font:inherit;border-radius:8px;border:1.5px solid var(--mu)}

function nModal(){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="mc"><button class="x" aria-label="Schließen">×</button><h3 style="margin:0 38px 8px 0">Stoffmenge n = 1 mol</h3><img src="${IMG}" alt="1 mol Kohlenstoff"><p>Die <b class="b">Stoffmenge n</b> (Einheit mol) gibt an, wie viele Teilchen betrachtet werden. <b>1 mol</b> sind 6,02*10<sup>23</sup> Teilchen (Avogadro-Konstante N<sub>A</sub>).</p><p>Ein einzelnes Kohlenstoffatom hat die Masse <b>12 u</b>. 1 mol Kohlenstoff-Atome hat die Masse <b>12 g</b>.</p><p>Der Zahlenwert der Teilchenmasse in u ist gleich dem Zahlenwert der Masse von 1 mol in g. Das ergibt die molare Masse:<br>M = ${fr('m','n')} = ${fr('12 g','1 mol')} = <b class="g">12 g/mol</b></p></div>`;const k=e=>{if(e.key=='Escape')c()},c=()=>{o.remove();removeEventListener('keydown',k)};o.onclick=e=>{if(e.target==o||e.target.className=='x')c()};addEventListener('keydown',k);document.body.append(o)}
document.addEventListener('click',e=>{if(e.target.closest('.bx.n,.mb[data-n]'))nModal()});
const LW={1:{t:'Lernweg 1 – Massenverhältnis & Dreisatz',s:[
['Reaktionsgleichung lesen',tbl([F,['3 Teilchen','2 Atome','3 Atome','1 Teilchen'],[dots(3,'#c98a4b'),dots(2,'#9aa5b5'),dots(3,'#6b7a90'),dots(1,'#4b7bd8')]])+`<p>Die <b class="r">stöchiometrischen Zahlen</b> beziehen sich auf das <u>Anzahlverhältnis der Stoffteilchen</u> (Atome, Ionengruppen oder Moleküle).</p><p>3 Teilchen FeO reagieren mit 2 Al-Atomen zu 3 Fe-Atomen und einem Teilchen Al<sub>2</sub>O<sub>3</sub>.</p>`],
['Massenverhältnis in u',tbl([F,[rc(3,'(55,8u+16u)'),rc(2,'27u'),rc(3,'55,8u'),rc(1,'(2·27u+3·16u)')],[rc(3,'71,8u'),rc(2,'27u'),rc(3,'55,8u'),rc(1,'102u')],['215,4u','54u','167,4u','102u']])+`<p class="mu">Die Atommassen in u liest man aus dem Periodensystem ab.</p>`],
['Massenverhältnis in g',`<p>Eine Masse in u kann man nicht wiegen – dasselbe Verhältnis gilt in Gramm:</p>`+tbl([F,['215,4 g','54 g','167,4 g','102 g']])],
['Beispielaufgabe: Dreisatz',`<p>Berechne die <b class="g">Masse von Aluminium</b>, die man benötigt, um <b class="o">1000 g Eisen</b> herzustellen.</p><p><b>1.</b> Reaktionsgleichung und Massenverhältnis aufstellen:</p>`+tbl([F,['215,4 g','54 g','<b class="b">167,4 g</b>','102 g']])+`<p><b>2.</b> Faktor berechnen: gegebene Masse Eisen (<b class="o">1000 g</b>) geteilt durch die Masse Eisen im Massenverhältnis (<b class="b">167,4 g</b>):<br><b class="o">1000 g</b> / <b class="b">167,4 g</b> = <b>5,974</b></p><p><b>3.</b> Die übrigen Massen des Massenverhältnisses mit dem Faktor multiplizieren:</p>`+tbl(['↓ &nbsp;· 5,974',['(1286,7 g)','<b class="g">322,6 g</b>','<b class="o">1000 g</b>','(609,3 g)']])],
['Ergebnis',`<p class="ok" style="font-size:18px">Man benötigt <span class="g">322,6 g</span> Aluminium, um <span class="o">1000 g</span> Eisen aus Eisen(II)-oxid herzustellen.</p>`]]},
2:{t:'Lernweg 2 – Stoffmengenverhältnis',s:[
['Reaktionsgleichung aufstellen',eq(R[0],{1:'g',2:'o'})+`<p>Gesucht: <b class="g">m(Al)</b> · Gegeben: <b class="o">m(Fe) = 1000 g</b></p>`],
['Stoffmenge des gegebenen Stoffs',`<p>n(mol) = ${fr('m (g)','M (g/mol)')}</p><p>n(Fe) = ${fr('m(Fe)','M(Fe)')} = ${fr('1000 g','55,8 g/mol')} = <b class="o">17,92 mol</b></p>`],
['Stoffmengenverhältnis',`<p>Aus den stöchiometrischen Zahlen: ${fr('n(Al)','n(Fe)')} = ${fr('<b class="g">2</b>','<b class="o">3</b>')}</p><p>Man braucht 2/3 so viel Aluminium, wie Eisen entsteht.</p>`],
['Stoffmenge des gesuchten Stoffs',`<p>n(Al) = ${fr('2','3')} · n(Fe) = ${fr('2','3')} · 17,92 mol = <b class="g">11,95 mol</b></p>`],
['Masse berechnen',`<p>m = n · M → m(Al) = 11,95 mol · 27 g/mol = <b class="g">322,6 g</b></p><p class="ok">Man benötigt 322,6 g Aluminium.</p>`]]}};
function nav(a){$('#nav').innerHTML=[['h','Start'],['1','Lernweg 1'],['2','Lernweg 2'],['p','Üben'],['g','Üben Gase'],['k','Üben komplex'],['t','Textaufgaben'],['s','Schema']].map(x=>`<button class="${x[0]==a?'on':''}" data-k="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.k))}
function go(k){nav(k);scrollTo({top:0,behavior:'smooth'});({h:home,1:()=>lw(1),2:()=>lw(2),p:newT,g:newG,k:newK,t:newX,s:schema})[k]();setTimeout(()=>{fit();lines()},30)}
function home(){V.innerHTML=`<div class="hero"><h2 style="font-size:clamp(20px,5vw,28px);margin:0">Rechnen mit der Reaktionsgleichung</h2><p>Wähle einen Lernweg, lass dir die Schritte nacheinander erklären und übe danach mit gestuften Hilfen.</p></div><div class="cards"><div class="cd" data-k="1"><span class="num">1</span><b>Lernweg 1</b><h3>Massenverhältnis &amp; Dreisatz</h3><p class="mu">Mit Teilchenmassen in u und g rechnen – ohne Stoffmenge.</p></div><div class="cd" data-k="2" style="animation-delay:.15s"><span class="num">2</span><b>Lernweg 2</b><h3>Stoffmengenverhältnis</h3><p class="mu">n = m/M, Stoffmengenverhältnis, zurück zur Masse.</p></div></div>`;document.querySelectorAll('[data-k]').forEach(e=>{if(e.closest('#v'))e.onclick=()=>go(e.dataset.k)})}
function lw(k){const L=LW[k];let i=0;V.innerHTML=`<h2 style="margin:8px 0">${L.t}</h2><div class="pg"><div id="pb"></div></div>${L.s.map((s,j)=>`<div class="st" id="s${j}"><h3><span class="num">${j+1}</span>${s[0]}</h3>${s[1]}</div>`).join('')}<div class="bt"><button class="big pr" id="nx">Weiter</button></div>`;
const nx=$('#nx');const step=()=>{$('#s'+i).classList.add('show');i++;$('#pb').style.width=i/L.s.length*100+'%';fit();$('#s'+(i-1)).scrollIntoView({behavior:'smooth',block:'center'});if(i==L.s.length){nx.textContent='Jetzt üben (Lernweg '+k+') →';nx.onclick=()=>{pw=k;go('p')}}};nx.onclick=step;step()}
let T,hn=0,sc=0,pw=1;
function newT(){const rx=R[Math.random()*R.length|0],s=sp(rx);const a=Math.random()*s.length|0;let b;do{b=Math.random()*s.length|0}while(b==a);const ma=[10,25,50,100,200,500,1000][Math.random()*7|0],na=ma/s[a][2],nb=na*s[b][0]/s[a][0];T={rx,a,b,ma,na,nb,ans:nb*s[b][2]};hn=0;draw()}
function draw(){const s=sp(T.rx),A=s[T.a],B=s[T.b];V.innerHTML=`<section class="pn"><h2 style="margin:0 0 8px">Übungsaufgabe</h2><div class="bt" style="margin:0 0 6px">${[1,2].map(w=>`<button class="gh pw" data-w="${w}" style="${pw==w?'background:var(--ac);color:#fff':''}">Nach Lernweg ${w}</button>`).join('')}</div>${eq(T.rx,{[T.a]:'o',[T.b]:'g'})}<p>Gegeben: <b class="o">m(${sub(A[1])}) = ${T.ma} g</b><br>Gesucht: <b class="g">m(${sub(B[1])})</b> in g</p><p class="mu">${s.map(x=>`M(${sub(x[1])}) = ${fm(x[2])} g/mol`).join(' · ')}</p><div class="rw"><div style="flex:1;min-width:0"><div class="hs" id="hs"></div><div class="in"><input id="ip" inputmode="decimal" placeholder="Ergebnis in g"><button id="ck">Prüfen</button></div><div id="fb" style="margin-top:8px"></div><div class="bt"><button class="gh" id="hb">Hilfe 1</button><button class="gh" id="nw">Neue Aufgabe</button></div></div>${pw==2?mini({g:[0],s:[0],b:[4,8],l:[3,5]}):''}</div><p class="mu">Richtig gelöst: ${sc}</p></section>`;

document.querySelectorAll('.sb').forEach(b=>b.onclick=()=>{if(X.locked)return;const k=+b.dataset.k;if(X.sel>=0){const o=X.as.indexOf(X.sel);if(o>=0){X.as[o]=-1;$('#f'+o).value=''}X.as[k]=X.sel;X.sel=-1}else X.as[k]=-1;refresh()});
$('#chk0').onclick=()=>{const nrm=t=>t.replace(/[₀-₉]/g,c=>c.charCodeAt(0)-8320).replace(/\s/g,'');let miss=false,side=false,all=true;
s.forEach((_,k)=>{const i=X.as[k],box=$('#sl'+k);if(i<0){miss=true;all=false;box.style.borderColor='var(--r)';return}const sd=(k<nl)==(i<nl),g=sd&&nrm($('#f'+k).value)==s[i][1];if(!sd)side=true;if(!g)all=false;box.style.borderColor=g?'var(--g)':'var(--r)';box.style.borderStyle='solid'});
const f=$('#f0m');
if(all){X.locked=true;refresh();f.innerHTML='<span class="ok">Richtig – Zuordnung und Formeln stimmen. ✔</span>';$('#chk0').remove();stepFac()}
else f.innerHTML=`<span class="no" style="display:inline-block">${miss?'Weise zuerst jedem Feld einen Stoff zu.':side?'Überlege noch einmal, welche Stoffe Edukte (links) und welche Produkte (rechts) sind.':'Mindestens eine Formel stimmt noch nicht. Tipp: Wasserstoff, Sauerstoff und Stickstoff bestehen aus zweiatomigen Molekülen; bei Ionenverbindungen gleichen sich die Ladungen aus.'}</span>`};fit()}
function stepFac(){const {rx,s,nl}=X,inp=i=>`<input class="ci" id="c${i}" inputmode="numeric" maxlength="2" aria-label="Faktor">`,part=(arr,o)=>arr.map((x,i)=>inp(o+i)+' '+sub(x[1])).join(' + ');
$('#s1').innerHTML=`<div style="animation:in .6s both"><h3 style="margin:12px 0 2px">2. Stöchiometrische Faktoren bestimmen</h3><p class="mu" style="margin:0">Trage die Faktoren ein (kleinste ganze Zahlen). Für den Faktor 1 bleibt das Feld leer.</p><div class="eq" id="ei">${part(s.slice(0,nl),0)} <span class="ar">→</span> ${part(s.slice(nl),nl)}</div><div class="bt"><button class="gh" id="chk">Prüfen</button></div><div id="f1m" style="margin-top:8px"></div></div>`;
$('#chk').onclick=()=>{const c=s.map((x,i)=>{const t=$('#c'+i).value.trim();return t===''?1:parseInt(t)});let all=true;c.forEach((v,i)=>{const e=$('#c'+i),g=v==s[i][0];e.style.borderColor=g?'var(--g)':'var(--r)';e.style.borderWidth='2px';if(!g)all=false});const f=$('#f1m');
if(all){f.innerHTML='<span class="ok">Richtig – die Gleichung ist ausgeglichen. ✔</span>';s.forEach((x,i)=>$('#c'+i).disabled=true);$('#chk').remove();step2()}
else f.innerHTML=c.every(v=>v>0)&&bal(rx,c)?'<span class="no" style="display:inline-block">Ausgeglichen, aber bitte die kleinsten ganzen Zahlen verwenden.</span>':'<span class="no" style="display:inline-block">Noch nicht richtig – zähle die Atome jeder Sorte auf beiden Seiten.</span>'};fit();$('#s1').scrollIntoView({behavior:'smooth',block:'nearest'})}
function step2(){$('#s2').innerHTML=`<div style="animation:in .6s both"><h3 style="margin:12px 0 2px">3. Berechnung</h3><p class="mu" style="margin:0">Wähle den Lernweg${X.gas?' (bei Gasvolumina nur Lernweg 2)':''}:</p><div class="bt"><button class="gh" data-p="1" ${X.gas?'disabled style="opacity:.4;cursor:not-allowed"':''}>Lernweg 1</button><button class="gh" data-p="2">Lernweg 2</button></div></div>`;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(!b.disabled)calc(+b.dataset.p)});$('#s2').scrollIntoView({behavior:'smooth',block:'nearest'})}
function calc(p){const {rx,s,gk,sk,q}=X,A=s[X.a],B=s[X.b],sa=sub(A[1]),sb=sub(B[1]),u=sk?'l':'g',f=q/(A[0]*A[2]);let H;
if(p==1)H=[`<b>Hilfe 1:</b> Massenverhältnis in g (stöchiometrische Zahl · M): <b class="o">${A[0]}·${fm(A[2])} g = ${fm(A[0]*A[2])} g</b> (${sa}) und <b class="g">${B[0]}·${fm(B[2])} g = ${fm(B[0]*B[2])} g</b> (${sb}).`,`<b>Hilfe 2:</b> Faktor: ${fr(q+' g',fm(A[0]*A[2])+' g')} = <b class="o">${fm(f,3)}</b>`,`<b>Hilfe 3:</b> ${fm(f,3)} · ${fm(B[0]*B[2])} g = ?`,`<b>Lösung:</b> m(${sb}) = ${fm(f,3)} · ${fm(B[0]*B[2])} g = <b class="g">${fm(X.ans,1)} g</b>`];
else H=[`<b>Hilfe 1:</b> Weg: ${gk?'n = '+fr('V','Vm'):'n = '+fr('m','M')}, Stoffmengenverhältnis, dann ${sk?'V = n·Vm':'m = n·M'}.`,`<b>Hilfe 2:</b> n(${sa}) = ${gk?fr(fm(q,2)+' l','24,5 l/mol'):fr(q+' g',fm(A[2])+' g/mol')} = <b class="o">${nn(X.na)} mol</b>`,`<b>Hilfe 3:</b> n(${sb}) = ${nn(X.na)} mol · ${B[0]}/${A[0]} = <b class="g">${nn(X.nb)} mol</b>. Fehlt nur ${sk?'V = n·Vm':'m = n·M'}.`,`<b>Lösung:</b> ${sk?`V(${sb}) = ${nn(X.nb)} mol · 24,5 l/mol`:`m(${sb}) = ${nn(X.nb)} mol · ${fm(B[2])} g/mol`} = <b class="g">${fm(X.ans,1)} ${u}</b>`];
const P=gk?(sk?{g:[6,7],s:[6],b:[8],l:[8,9]}:{g:[6,7],s:[0],b:[8,4],l:[8,9,5,3]}):(sk?{g:[0],s:[6],b:[4,8,7],l:[3,5,9,8]}:{g:[0],s:[0],b:[4,8],l:[3,5]});
$('#s3').innerHTML=`<div style="animation:in .6s both"><h3 style="margin:12px 0 4px">Berechnung nach Lernweg ${p}</h3><p><b>${X.qs}</b></p>${eq(rx,{[X.a]:'o',[X.b]:'g'})}<p class="mu">${s.map(x=>`M(${sub(x[1])}) = ${fm(x[2])} g/mol`).join(' · ')}${X.gas?' · Vm = 24,5 l/mol':''}</p><div class="rw"><div style="flex:1;min-width:0"><div class="hs" id="hs"></div><div class="in"><input id="ip" inputmode="decimal" placeholder="Ergebnis in ${u}"><button id="ck">Prüfen</button></div><div id="fb" style="margin-top:8px"></div><div class="bt"><button class="gh" id="hb">Hilfe 1</button></div></div>${p==2?mini(P):''}</div></div>`;let n=0;
$('#hb').onclick=()=>{$('#hs').insertAdjacentHTML('beforeend','<p>'+H[n]+'</p>');n++;$('#hb').textContent=n<3?'Hilfe '+(n+1):'Lösung zeigen';if(n==4)$('#hb').remove()};
$('#ck').onclick=()=>{const v=parseFloat($('#ip').value.replace(',','.')),fb=$('#fb');if(Math.abs(v-X.ans)/X.ans<.02){xs++;fb.innerHTML=`<span class="ok">Richtig! ${fm(X.ans,1)} ${u} 🎉</span>`;conf()}else fb.innerHTML='<span class="no" style="display:inline-block">Noch nicht ganz – nutze eine Hilfe.</span>'};fit();$('#s3').scrollIntoView({behavior:'smooth',block:'nearest'})}
function ln(g,sv,hl){const B=[...g.querySelectorAll('.bx,.mb')].map(e=>({x:e.offsetLeft,y:e.offsetTop,w:e.offsetWidth,h:e.offsetHeight})),R=i=>B[i].x+B[i].w,D=i=>B[i].y+B[i].h,cx=i=>B[i].x+B[i].w/2,y1=B[0].y+B[0].h*.37,y3=B[6].y+B[6].h*.48;
const L=[[R(0),y1,B[1].x,y1],[R(1),y1,B[2].x,y1],[cx(0),D(0),cx(3),B[3].y],[R(0),D(0),B[4].x,B[4].y],[cx(2),D(2),cx(5),B[5].y],[R(4),D(4),B[8].x,B[8].y],[cx(5),D(5),cx(8),B[8].y],[cx(3),D(3),cx(6),B[6].y],[R(6),y3,B[7].x,y3],[R(7),y3,B[8].x,y3]];
sv.setAttribute('viewBox',`0 0 ${g.clientWidth} ${g.clientHeight}`);sv.innerHTML=L.map((l,i)=>`<line class="${hl.includes(i)?'hl':''}" x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}"/>`).join('')}
function lines(){const g=$('.sg'),sv=$('#sl');if(g&&sv)ln(g,sv,[]);document.querySelectorAll('.ms').forEach(m=>ln(m,m.querySelector('svg'),JSON.parse(m.dataset.hl)))}
const MN=['m','m<sub>T</sub>','N','ρ','M','N<sub>A</sub>','V','Vm<br>c','n'];
function mini(P){return `<div class="mn"><div class="ms" data-hl="${JSON.stringify(P.l)}"><svg></svg>${MN.map((t,i)=>`<div class="mb ${P.g.includes(i)&&P.s.includes(i)?'og':P.g.includes(i)?'o2':P.s.includes(i)?'g2':P.b.includes(i)?'b2':''}"${i==8?' data-n="1"':''}><span>${t}</span></div>`).join('')}</div><div class="lg"><i class="a"></i>gegeben <i class="c"></i>gesucht <i class="d"></i>Weg</div></div>`}
function schema(){const L0=[[16.4,15.7,50,15.7],[50,15.7,83.6,15.7],[16.4,15.7,16.4,50],[83.6,15.7,83.6,50],[16.4,15.7,50,50],[50,50,83.6,84.3],[16.4,50,16.4,84.3],[83.6,50,83.6,84.3],[16.4,84.3,50,84.3],[50,84.3,83.6,84.3]];const l=(h,c='')=>`<span class="eq ln ${c}">${h}</span>`,t=h=>l(h,'tt'),m=h=>l(h,'sm');const X=[['',t('Masse')+l('m [g]')],['',t('Teilchenmasse')+l('m<sub>T</sub>=m/N [u]')],['',t('Teilchenzahl')+l('N')],['',t('Dichte')+l('ρ=m/V [g/l]')+l('ρ=M/Vm [g/l]')+t('Massenkonzentration')+l('c<sub>m</sub>=m/V [g/l]')],['',t('Molare Masse')+l('M=m/n [g/mol]')+l('⇒ aus PSE')],['',t('Avogadrokonstante')+l('6,02*10<sup>23</sup> 1/mol')+l('N<sub>A</sub>=N/n')],['',t('Volumen')+l('V [l]')],['',t('Molares Volumen')+m('bei Gasen')+l('Vm=V/n [l/mol]')+m('Vm<sub>0</sub>=22,4 l/mol')+m('Vm<sub>25</sub>=24,5 l/mol')+t('Konzentration')+m('bei Lösungen')+l('c=n/V [mol/l]')],['n',t('Stoffmenge')+l('n [mol]')]];;V.innerHTML=`<div class="cd" style="text-align:center;cursor:default;padding:10px"><b style="font-size:clamp(16px,4.5vw,20px)">Quantitative Beziehungen – Schema</b></div><div class="sg"><svg id="sl"></svg>${X.map((x,i)=>`<div class="bx ${x[0]}" style="animation-delay:${i*.08}s">${x[1]}</div>`).join('')}</div><p class="mu">Die Stoffmenge n verbindet Masse, Volumen und Teilchenzahl. Tippe auf die Stoffmenge n für eine Erklärung.</p>`}
go('h');
</script></body></html>
