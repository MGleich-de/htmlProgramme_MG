let M=[];

function initE(n,free){E=[];for(let i=0;i<n;i++)E.push({x:rnd(130,700),y:rnd(60,340),vx:rnd(-90,90),vy:rnd(-90,90),tr:[],a:rnd(0,6.28),i:i%24})}

const SC={

erk:'Die Moleküle sind insgesamt elektrisch neutral, daher leiten flüchtige Stoffe nicht. Die Aggregatzustände erklären Wechselwirkungen zwischen den Molekülen (Wasserstoffbrücken, Dipol-Dipol-Wechselwirkungen, London-Wechselwirkungen). Sie sind meist nur so stark, dass sich die Moleküle noch frei bewegen können: flüssig oder gasförmig.',

eig:'Metalle zeigen einen charakteristischen Glanz, sind gute elektrische Leiter und Wärmeleiter und duktil (verformbar).',
teil:'Atome (im Atomverband).',
bind:'Metall-Atome bilden untereinander eine Metallbindung (Atomverband). Alle Atome geben ihre Außenelektronen ab und werden zu positiven Atomrümpfen in einem regelmäßigen Metallgitter. Die abgegebenen Elektronen sind zwischen allen Ionen frei beweglich („Elektronengas“). Die Anziehung zwischen Ionen und Elektronen hält die Metall-Atome zusammen: metallische Bindung.',
erk:'Bei angelegter Spannung wandern die Elektronen zum Pluspol, vom Minuspol werden neue nachgeliefert: Es fließt Strom. Bei Druck verschieben sich die positiven Ionen leicht gegeneinander, das Elektronengas hält den Zusammenhalt aufrecht: Metalle sind verformbar.',
ex:[['Natrium','Na  (Na·)',g=>{for(const [x,y] of[[30,24],[70,24],[110,24],[50,58],[90,58]]){B(g,x,y,16,'Na','+','#14213d');el(g,x+rnd(-6,6)+18,y+8,.8)}},'m1']]}};
const TB=[['v','Flüchtige Stoffe'],['s','Salze'],['m','Metalle'],['c','Vergleich']];
/* ---------- Steuerung ---------- */
let kl=8,tab='v',cur=null,play=!matchMedia('(prefers-reduced-motion:reduce)').matches,spd=1,last=0;
function load(id){if(id=='vk8'&&!K8M[vk])vk='h2';cur=SC[id];T=0;hit=1e9;cc=1e9;cur.init&&cur.init();if(kl==8&&id=='s1')T=6;
$('slw').style.display=id=='v2'?'':'none';$('ba').style.display=cur.ctl?'':'none';$('bb').style.display=cur.sw?'':'none';if(cur.ctl)$('ba').textContent=cur.ctl.l;
if(id=='s3')$('ba').textContent='Zustand: fest (wechseln)';
document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b.dataset.id==id));$('bp').textContent=play?'Pause':'Weiter'}
function setTab(k){tab=k;const o=D[k];document.documentElement.style.setProperty('--ac',o?o.ac:'#4a6fa5');
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));
$('lab').hidden=k=='c';$('cmp').hidden=k!='c';if(k=='c'){cur=null;buildCmp();return}
$('chips').innerHTML=scl(o).map(s=>`<button data-id="${s}">${chipN(s)}</button>`).join('');
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>load(b.dataset.id));
$('stoff').innerHTML=`<h2>Stoffebene</h2><h3>Eigenschaften der Stoffe</h3><p>${o.eig}</p><h3>Beispiele <small style="font-weight:400;color:var(--mut)">(antippen: Bildung animieren)</small></h3><div class="ex" id="exs"></div>`;
$('teil').innerHTML=`<h2>Teilchenebene</h2><h3>Stoffteilchen</h3><p>${o.teil}</p><h3>Bindung</h3><p>${kv(o,'bind')}</p><h3>Erklärung der Stoffeigenschaften</h3><p>${kv(o,'erk')}</p>`;
for(const [n,f,d,sc] of o.ex){const w=document.createElement('div'),c=document.createElement('canvas');if(sc){w.tabIndex=0;w.setAttribute('role','button');w.title='Bildung animieren';const go=()=>{if(kl==8&&tab=='v'){vk=sc=='v1'?'h2':sc;load('vk8')}else if(SC[sc])load(sc);else{vk=sc;load('vx')}cv.scrollIntoView({behavior:'smooth',block:'center'})};w.onclick=go;w.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();go()}}}c.width=280;c.height=160;const x=c.getContext('2d');x.scale(2,2);d(x);w.append(c);w.insertAdjacentHTML('beforeend',`<b>${n}</b><br>${kl==8?f.replace(' (δ+ / δ−)',''):f}`);$('exs').append(w)}
if(kl==8)vk='h2';load(scl(o)[0])}
function buildCmp(){const rows=[['Eigenschaften','eig'],['Stoffteilchen','teil'],['Beispiel',null,['H₂, Br₂, HBr, Ne','NaCl','Na']],['Bindung','bind'],['Erklärung der Stoffeigenschaften','erk']];
$('cmp').innerHTML='<p>Tippe auf eine Spalte, um die Animationen zu öffnen.</p><div class="wrap"><table><tr><th></th>'+['v','s','m'].map(k=>`<th class="h" data-k="${k}" style="background:${D[k].ac}">${D[k].n}</th>`).join('')+'</tr>'+rows.map(r=>`<tr><th>${r[0]}</th>`+['v','s','m'].map((k,i)=>`<td>${r[1]?kv(D[k],r[1]):r[2][i]}</td>`).join('')+'</tr>').join('')+'</table></div>';
document.querySelectorAll('th.h').forEach(h=>h.onclick=()=>{setTab(h.dataset.k);scrollTo(0,0)})}
$('tabs').innerHTML=TB.map(([k,n])=>`<button data-k="${k}">${n}</button>`).join('');
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.k));
$('bp').onclick=()=>{play=!play;$('bp').textContent=play?'Pause':'Weiter'};
$('br').onclick=()=>{const id=Object.keys(SC).find(k=>SC[k]===cur);load(id)};
$('ba').onclick=()=>cur&&cur.ctl.f();
$('sp').oninput=e=>spd=+e.target.value;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
if(cur){const k=dt*spd*(play?1:0);T+=k;const q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,'#0b1a2e');q.addColorStop(1,'#16335c');g.fillStyle=q;g.fillRect(0,0,W,H);
cur.draw(g,k);$('cap').textContent=k8(cur.cap(T))}requestAnimationFrame(frame)}
$('bb').onclick=()=>{if(cur&&cur.sw&&cc>1e8)cc=T};
document.querySelectorAll('#kls button').forEach(b=>b.onclick=()=>{kl=+b.dataset.k;document.querySelectorAll('#kls button').forEach(x=>x.classList.toggle('on',x===b));setTab(tab)});
setTab('v');requestAnimationFrame(frame);
</script></body></html>
