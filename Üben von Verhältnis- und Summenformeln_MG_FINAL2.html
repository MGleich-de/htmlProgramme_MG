<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Üben von Verhältnis- und Summenformeln</title>
<style>
:root{--bg:#f3f8fd;--bg2:#dcebfa;--card:#ffffff;--tx:#1b2a3a;--mu:#5d7188;--ac:#2f7de1;--ac2:#14b8a6;--ok:#16a34a;--no:#dc2626;--bd:#d3e1f0;--sh:0 12px 34px rgba(40,90,150,.16);--dot:47,125,225;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1520;--bg2:#15263a;--card:#18232f;--tx:#e8eff7;--mu:#98a9bc;--ac:#5aa2ff;--ac2:#2dd4bf;--ok:#4ade80;--no:#f87171;--bd:#2b3b4f;--sh:0 12px 34px rgba(0,0,0,.5);--dot:90,162,255}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg),var(--bg2));transition:background .5s,color .5s;overflow-x:hidden}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:nowrap;animation:fd .8s both}
header .t{min-width:0}
h1{font-size:clamp(1.3rem,5vw,1.9rem);line-height:1.2;margin:0;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.au{margin:6px 0 0;color:var(--mu);font-size:.9rem}
.tg{flex:0 0 46px;width:46px;height:46px;border-radius:50%;border:2px solid var(--bd);background:var(--card);box-shadow:var(--sh);cursor:pointer;position:relative;overflow:hidden;padding:0;transition:transform .3s,background .5s,border-color .5s}
.tg:hover{transform:rotate(18deg) scale(1.06)}
.tg svg{position:absolute;inset:9px;width:24px;height:24px;transition:transform .6s cubic-bezier(.5,1.6,.4,1),opacity .4s}
.sun{color:#f59e0b}.moon{color:#7aa7ff}
:root[data-theme="light"] .moon{transform:translateY(30px) rotate(-90deg);opacity:0}
:root[data-theme="dark"] .sun{transform:translateY(-30px) rotate(90deg);opacity:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);padding:20px;margin-top:18px;transition:background .5s,border-color .5s;animation:up .7s both}
.lbl{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:0 0 10px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{flex:1 1 140px;padding:12px 14px;border-radius:14px;border:2px solid var(--bd);background:transparent;color:var(--tx);font:inherit;font-weight:600;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px}
.chip .ck{flex:0 0 18px;width:18px;min-width:18px;height:18px;box-sizing:border-box;border-radius:50%;border:2px solid var(--bd);display:inline-block;transition:all .3s}
.chip.on{border-color:var(--ac);background:linear-gradient(135deg,rgba(var(--dot),.14),rgba(20,184,166,.12))}
.chip.on .ck{background:var(--ac);border-color:var(--ac);box-shadow:inset 0 0 0 3px var(--card)}
.chip:hover{transform:translateY(-2px)}
.stats{display:flex;gap:10px;margin-top:16px}
.st{flex:1;text-align:center;padding:10px 4px;border-radius:14px;background:rgba(var(--dot),.08)}
.st b{display:block;font-size:1.35rem}.st span{font-size:.75rem;color:var(--mu)}
.bar{height:8px;border-radius:6px;background:rgba(var(--dot),.15);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.q{text-align:center;padding:10px 0 4px}
.kind{display:inline-block;font-size:.75rem;padding:3px 10px;border-radius:20px;background:rgba(var(--dot),.12);color:var(--ac);margin-bottom:10px}
.name{font-size:clamp(1.4rem,6vw,2.1rem);font-weight:700;overflow-wrap:anywhere;animation:pop .5s both}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
input{flex:1 1 200px;min-width:0;font:inherit;font-size:1.4rem;text-align:center;padding:12px 14px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);outline:none;transition:border-color .3s,box-shadow .3s,background .5s}
input:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(var(--dot),.18)}
input.ok{border-color:var(--ok);box-shadow:0 0 0 4px rgba(22,163,74,.2)}
input.no{border-color:var(--no);animation:sh .45s}
.btn{padding:12px 20px;border-radius:14px;border:0;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 16px rgba(var(--dot),.35);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}
.btn.g{background:transparent;color:var(--tx);border:2px solid var(--bd);box-shadow:none}
.sub{margin-top:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.key{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);font:inherit;font-size:1.05rem;cursor:pointer}
.key:hover{background:rgba(var(--dot),.12)}
.fb{min-height:24px;margin-top:16px;padding:12px 14px;border-radius:14px;display:none;line-height:1.5}
.fb.show{display:block;animation:up .4s both}
.fb.ok{background:rgba(22,163,74,.13);color:var(--ok)}
.fb.no{background:rgba(220,38,38,.12);color:var(--no)}
.fb.in{background:rgba(var(--dot),.1);color:var(--tx)}
.fb sup{font-size:.7em}
.hint{margin-top:10px;font-size:.85rem;color:var(--mu);text-align:center}
.burst{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:9;animation:bs .9s ease-out forwards}
@keyframes fd{from{opacity:0;transform:translateY(-14px)}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.8)}70%{transform:scale(1.04)}100%{opacity:1;transform:none}}
@keyframes sh{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes bs{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.hl{margin-top:12px;display:grid;gap:8px}
.hs{padding:10px 12px;border-radius:12px;background:rgba(var(--dot),.1);border-left:4px solid var(--ac);line-height:1.55;animation:up .4s both}
.hs sup{font-size:.7em}.mi{color:var(--no);font-weight:700}.ni{color:var(--ok);font-weight:700}.na{color:#c28a00;font-weight:700}
:root[data-theme="dark"] .na{color:#fbbf24}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.ov.show{display:flex;animation:fd .3s both}
.box{width:100%;max-width:1000px;max-height:100%;display:flex;flex-direction:column;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--sh)}
.bh{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;font-weight:700}
.bh .btn{padding:8px 14px}
.sc{overflow:auto;background:#000;min-height:0}
.sc img{display:block;width:100%;transition:width .35s}
.sc img.z{width:260%;max-width:none}
.alt{display:block;font-size:.55em;font-weight:500;color:var(--mu);margin-top:4px}
.qt{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qt .kind{margin:0}.qt .btn{padding:8px 14px;font-size:.85rem}
.row.sm{gap:8px}.row.sm .btn{padding:9px 12px;font-size:.88rem}
</style>
</head>

<div class="wrap">
<header>
 <div class="t"><h1>Üben von Verhältnis- und Summenformeln</h1><p class="au">Matthias Gleich</p></div>

 </div>
