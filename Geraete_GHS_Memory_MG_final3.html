<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chemie-Memory</title>
<style>
:root{--bg:#eef2f6;--cd:#fff;--tx:#18222e;--mu:#586677;--ln:#cdd6e0;--gl:#2b6cb0;--ac:#2b6cb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0e151e;--cd:#1a2431;--tx:#e8eef5;--mu:#9fb0c3;--ln:#2e3b4c;--gl:#6db3ee;color-scheme:dark}
body.ghs{--ac:#c8261c}body.lab{--ac:#1a78ad}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:16px 14px 40px}
h1{font:800 clamp(30px,8vw,46px)/1.05 Georgia,"Times New Roman",serif;margin:18px 0 4px;letter-spacing:-.5px}
.au{color:var(--mu);margin:0 0 22px}
section{display:none}section.on{display:block}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:12px;padding:10px 16px}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:#fff;border-color:transparent;font-weight:700}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.v{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border-radius:18px;border:2px solid var(--ln);text-align:center}
.v svg{width:84px;height:84px}.v b{font-size:17px}.v span{font-size:13px;color:var(--mu)}
.v.g:hover{border-color:#c8261c}.v.l:hover{border-color:#1a78ad}
.nn{display:flex;gap:8px;margin:18px 0 6px;align-items:center;flex-wrap:wrap}
.nn button.sel{border-color:var(--tx);font-weight:700}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}main:has(#s2.on){max-width:none;padding:8px 10px 10px}
.st{display:flex;gap:14px;font-weight:700}.st small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin:14px 0 20px}
.ov div{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:8px;text-align:center;font-size:12px;min-width:0;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;word-break:normal}
.ov svg{width:100%;max-width:64px;height:64px}
#g{display:grid;gap:10px;margin:auto}
.card{aspect-ratio:3/4;perspective:700px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.up .in,.card.ok .in{transform:rotateY(180deg)}
.bk,.fc{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:3%;overflow:hidden}
.bk{background:repeating-linear-gradient(45deg,transparent 0 9px,rgba(255,255,255,.1) 9px 10px),linear-gradient(145deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 0 0 3px rgba(255,255,255,.35)}
.bk svg{width:52%}
.fc{transform:rotateY(180deg);background:var(--cd);border:2px solid var(--ln);flex-direction:column;font-size:var(--fs,13px);font-weight:700;hyphens:auto;overflow-wrap:anywhere;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.fc svg{width:88%;height:auto;max-height:90%}.fc small{display:block;color:var(--ac);font-size:.8em}
.card.ok .fc{border-color:#2e9e50;box-shadow:0 0 0 3px rgba(46,158,80,.45),0 0 18px rgba(46,158,80,.5)}
svg *{stroke-linecap:round;stroke-linejoin:round}
.k{fill:none;stroke:#2f3640;stroke-width:2.6}.wa{fill:#a5d8f2}.sc{fill:none;stroke:#8d98a5;stroke-width:2}
.wd{fill:#dba765;stroke:#7a4f1d;stroke-width:2}.ck{fill:#e3a468;stroke:#b0662a;stroke-width:2}
.mt{fill:#b4bcc6;stroke:#3f4753;stroke-width:2}.wh{fill:#f4f1ea;stroke:#2f3640;stroke-width:2.4}
.fc img{width:90%;max-height:92%;object-fit:contain}.v img{width:84px;height:84px}.ov img{width:64px;height:64px}
.fc:has(svg:not(.x)),.ov div:has(svg){--p:1}
.fc>svg,.ov svg,.v svg{background:#f7f3e8;border-radius:10px}
#mb img{width:84px;height:84px;float:left;margin:0 14px 6px 0}#mb ul{margin:4px 0 4px 18px;padding:0}
#md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#md.on{display:flex}
#mb{background:var(--cd);border-radius:20px;max-width:420px;width:100%;padding:20px;border-top:8px solid #c8261c;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
#mb img,#mb svg{width:84px;height:84px;float:left;margin:0 14px 6px 0}
#mb h3{margin:4px 0 8px;font:700 20px Georgia,serif}#mb p{margin:6px 0;clear:none}#mb b{color:#c8261c}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.end{text-align:center;padding:30px 0}.end .big{font:800 42px Georgia,serif}
@media(prefers-reduced-motion:reduce){.in{transition:none}#mb{animation:none}}
</style></head><body>
<main>
<section id="s0" class="on">
<h1>Chemie-Memory</h1><p class="au">von Matthias Gleich</p><p><button class="th" onclick="theme()"></button></p>
<div class="vs">
<button class="v g" onclick="pick('ghs')"><span id="pg"></span><b>GHS-Piktogramme</b><span>Symbol ↔ Bezeichnung</span></button>
<button class="v l" onclick="pick('lab')"><span id="pl"></span><b>Laborgeräte</b><span>Abbildung ↔ Bezeichnung</span></button>
</div>
<div class="nn"><span>Anzahl Paare:</span><button data-n="6">6</button><button data-n="8" class="sel">8</button><button data-n="12">12</button><button data-n="0">Alle</button></div>
<p class="au">Bei „Alle“ spielst du mit jedem Paar der Variante. Vor dem Start siehst du eine Übersicht zum Einprägen.</p>
</section>
<section id="s1"><h2 id="ot"></h2><div class="ov" id="ov"></div><button class="pri" onclick="play()">Los geht’s</button> <button onclick="show('s0')">Zurück</button></section>
<section id="s2">
<div class="bar"><div class="st"><div><span id="mv">0</span><small>Züge</small></div><div><span id="fd">0</span><small>Paare</small></div><div><span id="tm">0:00</span><small>Zeit</small></div></div>
<div><button class="th" onclick="theme()"></button> <button onclick="snd=!snd;this.textContent=snd?'Ton an':'Ton aus'">Ton an</button> <button onclick="clearInterval(T);show('s0')">Variante wechseln</button></div></div>
<div id="g"></div>
</section>
<section id="s3" class="end"><div class="big">Geschafft!</div><p id="rs"></p><button class="pri" onclick="start()">Nochmal spielen</button> <button onclick="show('s0')">Variante wechseln</button></section>
</main>

function fit(){const g=$('#g');if(!deck||!g.children.length||!$('#s2').classList.contains('on'))return;const n=deck.length,gap=n>24?4:8,W=g.parentElement.clientWidth,H=innerHeight-(g.getBoundingClientRect().top+scrollY)-10;let best=0,bc=1;for(let c=1;c<=n;c++){const r=Math.ceil(n/c),cw=Math.min((W-gap*(c-1))/c,((H-gap*(r-1))/r)*.75);if(cw>best){best=cw;bc=c}}
